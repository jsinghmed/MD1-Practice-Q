<style>

.wrap{max-width:1100px;margin:0 auto;padding:26px 20px 60px}

.mvbtn svg{width:14px;height:14px}
.anim{margin:12px 0 0;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:10px 12px 12px}
.anim svg.stage{width:100%;max-width:620px;height:auto;display:block;margin:0 auto}
.card.open{grid-column:1/-1}
.anim .ctl{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px;color:var(--muted)}
.anim .ctl button{font:inherit;font-weight:700;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.anim .ctl .ang{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
.stage .skin{fill:var(--panel);stroke:var(--muted);stroke-width:2}
.stage .bone{fill:none;stroke:var(--line);stroke-width:7;stroke-linecap:round}
.stage .seat{fill:var(--line)}
.stage .quad{fill:#E0533D}
.stage .ham{fill:var(--muted);opacity:.18}
.stage .lbl{font:700 15px var(--body);fill:var(--ink)}
.stage .sub{font:13.5px var(--body);fill:var(--muted)}
.stage .arc{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:4 4}
.stage .lead{stroke:var(--muted);stroke-width:1.2}
.stage .lo{fill:none;stroke:var(--muted);stroke-linecap:round;stroke-linejoin:round}
.stage .li{fill:none;stroke:var(--panel);stroke-linecap:round;stroke-linejoin:round}
.stage .ghost{opacity:.22}
.stage .mus{fill:none;stroke:#E0533D;stroke-linecap:round}
.stage .jt{fill:var(--line)}
.stage .mk{fill:var(--acc)}
.stage .scp{fill:var(--acc-soft)}
.stage .sp{fill:none;stroke:var(--muted);stroke-width:3;stroke-linecap:round}
.stage .bn{stroke:var(--line);stroke-width:12;stroke-linecap:round}
.stage .bn.rad{stroke:var(--acc);opacity:.75}
.stage .palm{fill:var(--acc-soft);stroke:var(--muted);stroke-width:2}
.stage .sole{stroke:var(--acc);stroke-width:5;stroke-linecap:round}
.stage .bx{fill:none;stroke:none}
.stage .vw{font:700 12px var(--body);fill:var(--acc);letter-spacing:.03em}

function fitFor(M){if(M._fit)return M._fit;
  if(!MEAS){MEAS=document.createElementNS("http://www.w3.org/2000/svg","svg");MEAS.setAttribute("class","stage");MEAS.setAttribute("viewBox","0 0 560 450");MEAS.style.cssText="position:absolute;left:-9999px;top:0;width:560px;height:450px";document.body.appendChild(MEAS);}
  MEAS.innerHTML=`<g>${figMarkup(M,0,1)}${figMarkup(M,.5,1)}${figMarkup(M,1,1)}</g>`;const bb=MEAS.firstChild.getBBox(),b={x:bb.x-8,y:bb.y-8,width:bb.width+16,height:bb.height+16};MEAS.innerHTML="";
  const top=M.front||M.note?96:90,bot=M.front&&M.note?400:M.front||M.note?414:430,W=520,Hh=bot-top;
  const sc=Math.min(W/b.width,Hh/b.height,1.5);
  return M._fit={sc,tx:280-sc*(b.x+b.width/2),ty:(top+bot)/2-sc*(b.y+b.height/2)};}
function drawMove(M,k,act){const F=fitFor(M);
  return `<g transform="translate(${f1(F.tx)} ${f1(F.ty)}) scale(${F.sc.toFixed(3)})">${figMarkup(M,k,act)}</g>`+
    txt(18,28,M.lb,"lbl")+txt(18,48,M.nv,"sub")+txt(18,68,M.view,"vw")+
    (M.front?txt(280,M.note?418:440,"Front of the body ↓","sub","middle"):"")+(M.note?txt(280,440,M.note,"sub","middle"):"");
}
for(const key in MV){const M=MV[key];ANIM[key]={gen:1,
  svg:`<svg class="stage" viewBox="0 0 560 450" role="img" aria-label="${esc(key.replace("|",": "))}"></svg>`,
  frame(el,deg,act,k){el.querySelector("svg.stage").innerHTML=drawMove(M,k,act);},label:M.ang};}

const base=v=>v.replace(/,.*$/,"").replace(/ and C3–C4 cervical nerves/,"");
function nerves(){const set=new Set();D.filter(d=>d.r===R).forEach(d=>d.x.forEach(x=>x.v.split(/; | and (?=[A-Z])/).forEach(v=>set.add(base(v)))));
  const cur=$("nerve").value;$("nerve").innerHTML='<option value="">All nerves</option>'+[...set].sort().map(n=>`<option${n===cur?" selected":""}>${esc(n)}</option>`).join("");}
function hl(s,q){if(!q)return esc(s);const i=s.toLowerCase().indexOf(q);if(i<0)return esc(s);return esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+q.length))+"</mark>"+esc(s.slice(i+q.length));}
function rootHit(k,q){const m=q.match(/^([ct])(\d)$|^([ls])(\d)$/i);if(!m)return false;const want=q.toUpperCase();
  const toN=s=>{const c=s[0],n=+s.slice(1);return ({C:0,T:8,L:20,S:25})[c]+n;};
  const parts=k.replace(/,.*$/,"").split(/; /);return parts.some(p=>{const r=p.match(/([CTLS]\d)(?:–([CTLS]?\d))?/);if(!r)return false;let a=r[1],b=r[2]||r[1];if(/^\d$/.test(b))b=a[0]+b;return toN(want)>=toN(a)&&toN(want)<=toN(b);});}
function render(){
  const q=$("q").value.trim().toLowerCase(),nv=$("nerve").value;
  const list=D.filter(d=>d.r===R).map(d=>{
    let rows=d.x;
    if(nv)rows=rows.filter(x=>x.v.toLowerCase().includes(nv.toLowerCase()));
    if(!rows.length)return null;
    if(q){const mv=(d.j+" "+d.m).toLowerCase().includes(q);
      const hit=rows.filter(x=>x.n.toLowerCase().includes(q)||x.v.toLowerCase().includes(q)||rootHit(x.k,q));
      if(!mv&&!hit.length&&!d.t.toLowerCase().includes(q))return null;}
    return {...d,x:rows};}).filter(Boolean);
  const joints=[...new Set(list.map(d=>d.j))];
  $("jumps").innerHTML=joints.map(j=>`<a href="#j-${j}">${esc(j)}</a>`).join("");
  $("out").innerHTML=joints.length?joints.map(j=>`<section class="joint" id="j-${j}"><h2>${esc(j)}</h2><div class="grid">`+list.filter(d=>d.j===j).map(d=>
    `<article class="card"><h3>${hl(d.m,q)}</h3><table>${d.x.map(x=>`<tr><td class="mu${x.p?" p":""}">${hl(x.n,q)}</td><td><span class="nv">${hl(x.v,q)}</span><span class="rt">${esc(x.k)}</span></td></tr>`).join("")}</table>${d.t?`<p class="note">${hl(d.t,q)}</p>`:""}${ANIM[d.j+"|"+d.m]?`<button type="button" class="mvbtn" data-anim="${esc(d.j+"|"+d.m)}" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>Show movement</button><div class="anim" hidden></div>`:""}</article>`).join("")+`</div></section>`).join("")
    :`<p class="empty">No movements match. Try another muscle, nerve or root level.</p>`;
}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{R=b.dataset.r;document.querySelectorAll(".seg button").forEach(x=>{x.classList.toggle("on",x===b);x.setAttribute("aria-selected",x===b)});$("nerve").value="";nerves();render();});
$("q").oninput=render;$("nerve").onchange=render;
if(location.hash==="#lower")document.querySelector('[data-r="lower"]').click();else{nerves();render();}
</script>
</body>
</html>
