<style>
:root{--bg:#EDF1F0;--panel:#FFFFFF;--ink:#16212C;--muted:#55626E;--line:#CDD5D8;--soft:#F4F7F6;--acc:#127566;--acc-soft:#DDF0EC;--nerve-ink:#6B5000;--nerve-soft:#FFF5D1;--focus:#2462C4;

:root[data-theme="dark"]{--bg:#0F151B;--panel:#18212A;--ink:#E6ECEF;--muted:#9DAAB4;--line:#2B3740;--soft:#1E2832;--acc:#52C4AF;--acc-soft:#173A35;--nerve-ink:#F5D97C;--nerve-soft:#3A3116;--focus:#86AEF2}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:26px 20px 60px}
h1{font-family:var(--head);font-weight:600;font-size:clamp(26px,4vw,38px);margin:0 0 6px;letter-spacing:-.01em}
.lead{margin:0;color:var(--muted);max-width:70ch}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 12px;margin-top:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--ink);font:inherit;font-weight:700;padding:8px 16px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:var(--panel)}
input,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
input{flex:1 1 220px;min-width:180px}
select{max-width:280px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.jumps{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.jumps a{font-size:13px;font-weight:700;color:var(--acc);text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px}
.legend{font-size:13px;color:var(--muted);margin:10px 0 0}
.legend b{color:var(--ink)}
.joint{margin:26px 0 0;scroll-margin-top:80px}
.joint h2{font-family:var(--head);font-weight:600;font-size:24px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{margin:0 0 8px;font-size:16.5px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 0;vertical-align:top;border-top:1px solid var(--line)}
tr:first-child td{border-top:0}
td.mu{padding-right:10px;width:46%}
td.mu.p{font-weight:700}
.nv{display:block;color:var(--ink)}
.rt{display:inline-block;margin-top:3px;font-size:12px;font-weight:700;color:var(--nerve-ink);background:var(--nerve-soft);border-radius:4px;padding:1px 6px}
.note{margin:10px 0 0;font-size:13.5px;color:var(--muted);border-left:3px solid var(--acc);padding:2px 0 2px 10px}
mark{background:var(--acc-soft);color:inherit;border-radius:3px;padding:0 1px}
.empty{margin:30px 0;color:var(--muted)}
.mvbtn{margin:12px 0 0;display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13.5px;font-weight:700;color:var(--acc);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer}
.mvbtn svg{width:14px;height:14px}
.anim{margin:12px 0 0;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:10px 12px 12px}
.anim svg.stage{width:100%;max-width:620px;height:auto;display:block;margin:0 auto}
.card.open{grid-column:1/-1}
.anim .ctl{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px;color:var(--muted)}
.anim .ctl button{font:inherit;font-weight:700;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.anim .ctl .ang{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
.stage .skin{fill:var(--panel);stroke:var(--muted);stroke-width:2}
.stage .bone{fill:none;stroke:var(--line);stroke-width:7;stroke-linecap:round}
.stage .seat{fill:var(--line)}
.stage .quad{fill:#E0533D}
.stage .ham{fill:var(--muted);opacity:.18}
.stage .lbl{font:700 15px var(--body);fill:var(--ink)}
.stage .sub{font:13.5px var(--body);fill:var(--muted)}
.stage .arc{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:4 4}
.stage .lead{stroke:var(--muted);stroke-width:1.2}
@media (prefers-reduced-motion:reduce){.anim .ctl::after{content:"Animation paused for reduced motion · press Play";}}
@media (max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:18px 14px 50px}select{max-width:100%;flex:1 1 100%}}
</style>

<h1>Limb movements</h1>
<p class="lead">Every movement of the upper and lower limb with the muscles that produce it, their nerves and root levels. Main movers are in bold.</p>

const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function startAnim(box,key){
  const A=ANIM[key];box.innerHTML=A.svg+`<div class="ctl"><button type="button" data-pp>Pause</button><span>Contracting muscle glows as it works</span><span class="ang"></span></div>`;
  const ang=box.querySelector(".ang"),pp=box.querySelector("[data-pp]");let t0=performance.now(),paused=matchMedia("(prefers-reduced-motion: reduce)").matches,held=0,raf;
  if(paused)pp.textContent="Play";
  const P=3600;
  function draw(now){const t=((paused?held:now-t0)%P)/P;let deg,act;
    if(t<.42){const k=ease(t/.42);deg=A.from+(A.to-A.from)*k;act=1;}
    else if(t<.5){deg=A.to;act=1;}
    else if(t<.92){const k=ease((t-.5)/.42);deg=A.to+(A.from-A.to)*k;act=.25;}
    else{deg=A.from;act=.25;}
    A.frame(box,deg,act);ang.textContent="Knee bent "+Math.round(deg)+"°";
    if(!paused)raf=requestAnimationFrame(draw);}

  box._stop=()=>cancelAnimationFrame(raf);
  draw(performance.now());
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-anim]");if(!b)return;const box=b.nextElementSibling;

  else{box._stop&&box._stop();box.hidden=true;box.innerHTML="";b.closest(".card").classList.remove("open");b.setAttribute("aria-expanded","false");b.lastChild.textContent="Show movement";}});

const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const base=v=>v.replace(/,.*$/,"").replace(/ and C3–C4 cervical nerves/,"");
function nerves(){const set=new Set();D.filter(d=>d.r===R).forEach(d=>d.x.forEach(x=>x.v.split(/; | and (?=[A-Z])/).forEach(v=>set.add(base(v)))));
  const cur=$("nerve").value;$("nerve").innerHTML='<option value="">All nerves</option>'+[...set].sort().map(n=>`<option${n===cur?" selected":""}>${esc(n)}</option>`).join("");}
function hl(s,q){if(!q)return esc(s);const i=s.toLowerCase().indexOf(q);if(i<0)return esc(s);return esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+q.length))+"</mark>"+esc(s.slice(i+q.length));}
function rootHit(k,q){const m=q.match(/^([ct])(\d)$|^([ls])(\d)$/i);if(!m)return false;const want=q.toUpperCase();
  const toN=s=>{const c=s[0],n=+s.slice(1);return ({C:0,T:8,L:20,S:25})[c]+n;};
  const parts=k.replace(/,.*$/,"").split(/; /);return parts.some(p=>{const r=p.match(/([CTLS]\d)(?:–([CTLS]?\d))?/);if(!r)return false;let a=r[1],b=r[2]||r[1];if(/^\d$/.test(b))b=a[0]+b;return toN(want)>=toN(a)&&toN(want)<=toN(b);});}
function render(){
  const q=$("q").value.trim().toLowerCase(),nv=$("nerve").value;
  const list=D.filter(d=>d.r===R).map(d=>{
    let rows=d.x;
    if(nv)rows=rows.filter(x=>x.v.toLowerCase().includes(nv.toLowerCase()));
    if(!rows.length)return null;
    if(q){const mv=(d.j+" "+d.m).toLowerCase().includes(q);
      const hit=rows.filter(x=>x.n.toLowerCase().includes(q)||x.v.toLowerCase().includes(q)||rootHit(x.k,q));
      if(!mv&&!hit.length&&!d.t.toLowerCase().includes(q))return null;}
    return {...d,x:rows};}).filter(Boolean);
  const joints=[...new Set(list.map(d=>d.j))];
  $("jumps").innerHTML=joints.map(j=>`<a href="#j-${j}">${esc(j)}</a>`).join("");
  $("out").innerHTML=joints.length?joints.map(j=>`<section class="joint" id="j-${j}"><h2>${esc(j)}</h2><div class="grid">`+list.filter(d=>d.j===j).map(d=>
    `<article class="card"><h3>${hl(d.m,q)}</h3><table>${d.x.map(x=>`<tr><td class="mu${x.p?" p":""}">${hl(x.n,q)}</td><td><span class="nv">${hl(x.v,q)}</span><span class="rt">${esc(x.k)}</span></td></tr>`).join("")}</table>${d.t?`<p class="note">${hl(d.t,q)}</p>`:""}${ANIM[d.j+"|"+d.m]?`<button type="button" class="mvbtn" data-anim="${esc(d.j+"|"+d.m)}" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>Show movement</button><div class="anim" hidden></div>`:""}</article>`).join("")+`</div></section>`).join("")
    :`<p class="empty">No movements match. Try another muscle, nerve or root level.</p>`;
}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{R=b.dataset.r;document.querySelectorAll(".seg button").forEach(x=>{x.classList.toggle("on",x===b);x.setAttribute("aria-selected",x===b)});$("nerve").value="";nerves();render();});
$("q").oninput=render;$("nerve").onchange=render;
if(location.hash==="#lower")document.querySelector('[data-r="lower"]').click();else{nerves();render();}
