html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}

header h1{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}

.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}

#info .kind{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#info h2{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.15;margin:6px 0 10px;text-wrap:balance}
#info dl{margin:0;display:grid;grid-template-columns:92px minmax(0,1fr);gap:7px 10px}
#info dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
#info dd{margin:0;min-width:0}
#info .note{margin:12px 0 0;padding:9px 11px;border-left:3px solid var(--accent);background:var(--chip);border-radius:0 6px 6px 0;font-size:13px}
#info .note b{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:2px;font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

button,.btn{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}

button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.layers{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.layer .n{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.layer[aria-pressed="true"] .n{color:inherit;opacity:.8}

#list .it{all:unset;box-sizing:border-box;cursor:pointer;padding:5px 8px;border-radius:5px;display:flex;justify-content:space-between;gap:8px;font-size:13px}

#list .it:focus-visible{outline:2px solid var(--accent)}
#list .it[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
#list .it small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
#list .it[aria-current="true"] small{color:inherit;opacity:.8}

.views{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.views button{pointer-events:auto;background:var(--panel);font-size:12px;padding:5px 9px}
.hint{position:absolute;left:10px;bottom:10px;right:130px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;background:var(--panel);border:1px solid var(--line);padding:4px 8px;border-radius:5px;pointer-events:none}
.compass{position:absolute;right:10px;bottom:10px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:4px 8px;border-radius:5px}
.tag{position:absolute;pointer-events:none;transform:translate(-50%,-130%);background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;padding:4px 8px;border-radius:5px;white-space:nowrap}
.tag::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--ink)}

#tip::after{display:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono);font-size:12px}

@media (max-width:760px){

/* geometry builders */
function sweep(pts,R,ring,density){
  const vs=pts.map(V);
  const curve=new THREE.CatmullRomCurve3(vs,false,'centripetal',0.5);
  const len=curve.getLength();
  const L=Math.min(90,Math.max(6,Math.round(len*(density||2.2))));
  const fr=curve.computeFrenetFrames(L,false);
  const pos=[],col=[],idx=[];
  for(let i=0;i<=L;i++){const t=i/L;const Pp=curve.getPointAt(t);const r=ring(t,Pp,fr.normals[i],fr.binormals[i],fr.tangents[i]);
    r.pts.forEach(q=>{pos.push(q.x,q.y,q.z);col.push(r.c[0],r.c[1],r.c[2]);});}
  for(let i=0;i<L;i++)for(let j=0;j<R;j++){const a=i*R+j,b=i*R+(j+1)%R,c=(i+1)*R+j,d=(i+1)*R+(j+1)%R;idx.push(a,c,b,b,c,d);}
  [0,L].forEach(i=>{const base=pos.length/3;const cp=curve.getPointAt(i/L);const ci=i*R;pos.push(cp.x,cp.y,cp.z);col.push(col[ci*3],col[ci*3+1],col[ci*3+2]);
    for(let j=0;j<R;j++){const k=ci+j;pos.push(pos[k*3],pos[k*3+1],pos[k*3+2]);col.push(col[k*3],col[k*3+1],col[k*3+2]);}
    for(let j=0;j<R;j++)idx.push(base,base+1+j,base+1+(j+1)%R);});
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.setIndex(idx);g.computeVertexNormals();return g;
}
const WHITE=[1,1,1];
function tube(pts,prof,colorFn,R,density){R=R||12;return sweep(pts,R,(t,Pp,N,B)=>{const r=prof(t);const out=[];for(let j=0;j<R;j++){const a=j/R*Math.PI*2;out.push(Pp.clone().addScaledVector(N,Math.cos(a)*r).addScaledVector(B,Math.sin(a)*r));}return{pts:out,c:colorFn?colorFn(t,r):WHITE};},density);}
function ribbonG(pts,w,side,th){const sv=V(side);return sweep(pts,4,(t,Pp,N,B,Tn)=>{const S=sv.clone().addScaledVector(Tn,-sv.dot(Tn));if(S.lengthSq()<1e-6)S.copy(N);S.normalize();const U=new THREE.Vector3().crossVectors(Tn,S).normalize();const hw=w/2,ht=th/2;
  return{pts:[[1,1],[-1,1],[-1,-1],[1,-1]].map(([a,b])=>Pp.clone().addScaledVector(S,a*hw).addScaledVector(U,b*ht)),c:WHITE};},1.6);}
function ellG(c,s,seg){const g=new THREE.SphereGeometry(1,seg||18,Math.round((seg||18)*0.7));g.scale(s[0],s[1],s[2]);g.translate(c[0],c[1],c[2]);const n=g.attributes.position.count;g.setAttribute('color',new THREE.Float32BufferAttribute(new Array(n*3).fill(1),3));return g;}
function plate(outline,normal,th){const n=V(normal).normalize();const c=new THREE.Vector3();outline.forEach(p=>c.add(V(p)));c.divideScalar(outline.length);
  const pos=[],idx=[];const top=outline.map(p=>V(p).addScaledVector(n,th/2)),bot=outline.map(p=>V(p).addScaledVector(n,-th/2));const ct=c.clone().addScaledVector(n,th*0.9),cb=c.clone().addScaledVector(n,-th*0.9);
  const m=outline.length;const push=v=>{pos.push(v.x,v.y,v.z);return pos.length/3-1;};
  const it=top.map(push),ib=bot.map(push),ic=push(ct),icb=push(cb);
  for(let i=0;i<m;i++){const j=(i+1)%m;idx.push(ic,it[i],it[j]);idx.push(icb,ib[j],ib[i]);idx.push(it[i],ib[i],ib[j],it[i],ib[j],it[j]);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(new Array(pos.length).fill(1),3));g.setIndex(idx);g.computeVertexNormals();return g;}
function torusG(c,R,r,sy,rotY){const g=new THREE.TorusGeometry(R,r,8,32);g.rotateY(Math.PI/2);g.scale(1,sy||1,1);if(rotY)g.rotateY(rotY);if(!rotY)g.rotateZ(Math.PI/2);g.translate(c[0],c[1],c[2]);const n=g.attributes.position.count;g.setAttribute('color',new THREE.Float32BufferAttribute(new Array(n*3).fill(1),3));return g;}

  if(layer==='joint')return new THREE.MeshStandardMaterial(Object.assign(base,{color:L.hex,roughness:0.3,transparent:true,opacity:0.5,depthWrite:false}));}

const segBone=(id,a,b,e1,m,e2)=>addMesh(id,tube([lerp(a,b,0.04),lerp(a,b,0.5),lerp(a,b,0.96)],boneProf(e1,m,e2,0.16),null,10));
segBone('mt1',MT[1].base,MT[1].head,0.62,0.46,0.58);
[2,3,4,5].forEach(d=>segBone('mt'+d,MT[d].base,MT[d].head,0.44,0.3,0.42));
addMesh('mt5',ellG([4.2,-89.3,4.4],[0.45,0.4,0.5]));
addMesh('mt1',ellG([-0.55,-90.6,11.3],[0.28,0.28,0.32]));addMesh('mt1',ellG([-1.3,-90.6,11.3],[0.28,0.28,0.32]));
segBone('ph_prox',MT[1].head,TO[1].pip,0.5,0.4,0.45);segBone('ph_dist',TO[1].pip,TO[1].tip,0.42,0.32,0.38);
[2,3,4,5].forEach(d=>{segBone('ph_prox',MT[d].head,TO[d].pip,0.34,0.25,0.3);segBone('ph_mid',TO[d].pip,TO[d].dip,0.28,0.22,0.26);segBone('ph_dist',TO[d].dip,TO[d].tip,0.24,0.18,0.22);});

/* ---- muscles ---- */
const TEND=new THREE.Color(0xeadfce);
let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
MUS.forEach(m=>{const belly=new THREE.Color().setHSL(0.006+rnd()*0.022,0.5+rnd()*0.1,0.36+rnd()*0.08);
  m.parts.forEach(p=>{const prof=t=>(t<p.a||t>p.b)?p.tr:p.tr+(p.r-p.tr)*Math.pow(Math.sin(Math.PI*(t-p.a)/(p.b-p.a)),0.65);
    const cf=(t,r)=>{const w=p.r>p.tr?Math.min(1,Math.max(0,(r-p.tr)/(p.r-p.tr)*2.2)):0;const c=TEND.clone().lerp(belly,w);return[c.r,c.g,c.b];};
    addMesh(m.id,tube(p.pts,prof,cf,p.r>0.5?14:10,p.r>0.5?2.4:3));});});

/* ---- ligaments ---- */
LIGS.forEach(l=>l.parts.forEach(p=>{
  if(p.torus)addMesh(l.id,torusG(p.torus.c,p.torus.R,p.torus.r,p.torus.sy,p.torus.rotY));
  else if(p.ell)addMesh(l.id,ellG(p.ell.c,p.ell.s,12));
  else if(p.rib)addMesh(l.id,ribbonG(p.pts,p.w,p.side,p.th));
  else addMesh(l.id,tube(p.pts,()=>p.r,null,8,3));}));
/* ---- joints ---- */
JOINTS.forEach(j=>j.ells.forEach(([c,s])=>addMesh(j.id,ellG(c,s,20))));
/* ---- nerves ---- */
NERVES.forEach(n=>n.parts.forEach(p=>addMesh(n.id,tube(p.pts,()=>p.r,null,8,2.5))));
document.getElementById('loading').remove();

/* ---------------- state + look ---------------- */
const state={sel:null,hover:null,isolate:false,muscleOp:1,vis:{bone:true,muscle:true,ligament:true,joint:false,nerve:true},region:'all',q:''};
try{const s=JSON.parse(localStorage.getItem('lla-vis')||'null');if(s)Object.assign(state.vis,s);}catch(e){}
const ACC=new THREE.Color(0x1aa6b0), HOV=new THREE.Color(0x0f5a60);
function applyLook(){Object.values(ITEMS).forEach(it=>{const m=it.mat;
  let op=it.layer==='muscle'?state.muscleOp:(it.layer==='joint'?0.5:1);
  if(state.isolate&&state.sel&&it.id!==state.sel)op=Math.min(op,0.07);
  if(it.id===state.sel&&it.layer==='joint')op=0.75;
  const tr=op<0.999;if(m.transparent!==tr){m.transparent=tr;m.needsUpdate=true;}m.opacity=op;m.depthWrite=!tr;
  if(it.id===state.sel){m.emissive.copy(ACC);m.emissiveIntensity=0.55;}
  else if(it.id===state.hover){m.emissive.copy(HOV);m.emissiveIntensity=0.6;}
  else{m.emissive.copy(it.baseEm);m.emissiveIntensity=1;}});
  Object.keys(groups).forEach(k=>groups[k].visible=state.vis[k]);}

/* ---------------- camera ---------------- */
const VIEWS={
 Anterior:{t:[-2,-34,0],d:[0,0.06,1],r:232},Posterior:{t:[-2,-34,0],d:[0,0.06,-1],r:232},Lateral:{t:[1,-34,0],d:[1,0.05,0.05],r:226},
 Hip:{t:[-1.5,1,0],d:[0.6,0.3,1],r:52},Gluteal:{t:[-2,0,-4],d:[0.3,0.15,-1],r:52},Knee:{t:[1.2,-46,0],d:[0.5,0.15,1],r:32},Foot:{t:[1.8,-88,5],d:[0.55,0.75,0.9],r:36},Sole:{t:[1.8,-90,5],d:[0.15,-1,-0.05],r:34}};
let anim=null;
function flyTo(t,pos){anim={t0:performance.now(),dur:650,ft:controls.target.clone(),fp:camera.position.clone(),tt:V(t),tp:pos};}
function setView(name){const v=VIEWS[name];const dir=V(v.d).normalize();const asp=Math.max(0.6,stage.clientWidth/Math.max(1,stage.clientHeight));const r=v.r*(asp<1?1/Math.sqrt(asp):1);flyTo(v.t,V(v.t).addScaledVector(dir,r));}
function focusItem(id){const it=ITEMS[id];const box=new THREE.Box3();it.meshes.forEach(m=>box.expandByObject(m));const c=box.getCenter(new THREE.Vector3());const sz=box.getSize(new THREE.Vector3()).length();
  const dir=camera.position.clone().sub(controls.target).normalize();const dist=Math.min(150,Math.max(14,sz*1.7));flyTo([c.x,c.y,c.z],c.clone().addScaledVector(dir,dist));}
{const v=VIEWS.Anterior;controls.target.set(...v.t);camera.position.copy(V(v.t).addScaledVector(V(v.d).normalize(),v.r));}

/* ---------------- picking ---------------- */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
function pick(cx,cy){const r=canvas.getBoundingClientRect();mouse.set(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1);ray.setFromCamera(mouse,camera);
  const objs=[];Object.keys(groups).forEach(k=>{if(!state.vis[k])return;if(k==='muscle'&&state.muscleOp<0.2)return;groups[k].children.forEach(m=>{const it=ITEMS[m.userData.id];if(state.isolate&&state.sel&&it.id!==state.sel)return;objs.push(m);});});
  const hits=ray.intersectObjects(objs,false);if(!hits.length)return null;
  // prefer an opaque hit; if the first is a translucent joint and something solid is right behind, keep the joint (it was clicked)
  return hits[0].object.userData.id;}
let down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(moved>6)return;const id=pick(e.clientX,e.clientY);select(id,false);});
const tip=document.getElementById('tip');let pend=null;
canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;pend={x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointerleave',()=>{pend=null;state.hover=null;tip.hidden=true;applyLook();});

/* ---------------- UI ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function renderInfo(){const el=$('#info');const it=ITEMS[state.sel];
  if(!it){el.innerHTML='<p class="label">Selection</p><p style="margin:0;color:var(--muted)">Click any structure in the model, or pick one from the list below.</p>';return;}
  const L=LAYERS[it.layer];const rows=Object.entries(it.info).filter(([k])=>k!=='note');
  el.innerHTML=`<div class="kind"><span class="dot" style="background:var(${L.color})"></span>${esc(L.name.replace(/s$/,''))} · ${esc(REGIONS[it.region])}</div><h2>${esc(it.name)}</h2><dl>${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>${it.info.note?`<p class="note"><b>Clinical / exam note</b>${esc(it.info.note)}</p>`:''}
  <div class="actions"><button id="bFocus">Zoom to it</button><button id="bIso" aria-pressed="${state.isolate}">Isolate</button><button id="bClear">Clear</button></div>`;
  $('#bFocus').onclick=()=>focusItem(state.sel);
  $('#bIso').onclick=()=>{state.isolate=!state.isolate;applyLook();renderInfo();};
  $('#bClear').onclick=()=>select(null);}
function select(id,fromList){if(id&&!state.vis[ITEMS[id].layer]){state.vis[ITEMS[id].layer]=true;renderLayers();}
  state.sel=id;if(!id)state.isolate=false;applyLook();renderInfo();renderList();
  if(id&&fromList)focusItem(id);
  if(id&&fromList===false&&window.matchMedia('(max-width:760px)').matches){}}
function renderLayers(){const el=$('#layers');el.innerHTML='';Object.entries(LAYERS).forEach(([k,L])=>{const n=Object.values(ITEMS).filter(i=>i.layer===k).length;
  const b=document.createElement('button');b.className='layer';b.id='lay-'+k;b.setAttribute('aria-pressed',state.vis[k]);b.innerHTML=`<span class="dot" style="background:var(${L.color})"></span>${L.name}<span class="n">${n}</span>`;
  b.onclick=()=>{state.vis[k]=!state.vis[k];try{localStorage.setItem('lla-vis',JSON.stringify(state.vis));}catch(e){}renderLayers();applyLook();};el.appendChild(b);});
  const ctx=document.createElement('button');ctx.className='layer';ctx.id='lay-ctx';ctx.setAttribute('aria-pressed',ctxGroup.visible);ctx.innerHTML=`<span class="dot" style="background:var(--muted)"></span>Pelvis &amp; spine<span class="n">ref</span>`;ctx.onclick=()=>{ctxGroup.visible=!ctxGroup.visible;renderLayers();};el.appendChild(ctx);}
function renderRegions(){const el=$('#regions');el.innerHTML='';[['all','All'],...Object.entries(REGIONS)].forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.setAttribute('aria-pressed',state.region===k);b.onclick=()=>{state.region=k;renderRegions();renderList();};el.appendChild(b);});}
function renderList(){const el=$('#list');const q=state.q.trim().toLowerCase();el.innerHTML='';
  Object.entries(LAYERS).forEach(([k,L])=>{const items=ORDER.map(i=>ITEMS[i]).filter(it=>it.layer===k&&(state.region==='all'||it.region===state.region)&&(!q||it.name.toLowerCase().includes(q)||JSON.stringify(it.info).toLowerCase().includes(q)));
    if(!items.length)return;const h=document.createElement('h3');h.innerHTML=`<span class="dot" style="background:var(${L.color})"></span>${L.name} <span style="margin-left:auto">${items.length}</span>`;el.appendChild(h);
    items.forEach(it=>{const b=document.createElement('button');b.className='it';b.setAttribute('aria-current',it.id===state.sel);b.innerHTML=`<span>${esc(it.name)}</span><small>${esc(REGIONS[it.region].split(' ')[0])}</small>`;b.onclick=()=>select(it.id,true);el.appendChild(b);});});
  if(!el.children.length)el.innerHTML='<p style="color:var(--muted);margin:8px 0 0">No structures match. Try a nerve root (L5), a bone, or an action like "evert".</p>';}
$('#q').addEventListener('input',e=>{state.q=e.target.value;renderList();});
$('#mop').addEventListener('input',e=>{state.muscleOp=e.target.value/100;$('#mopv').textContent=e.target.value+'%';applyLook();});
const vEl=$('#views');Object.keys(VIEWS).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>setView(n);vEl.appendChild(b);});

/* pan / zoom pad + keyboard */
function panBy(dx,dy){const d=camera.position.distanceTo(controls.target)*0.035;const rt=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0),up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);const mv=rt.multiplyScalar(-dx*d).add(up.multiplyScalar(-dy*d));controls.target.add(mv);camera.position.add(mv);}
function zoomBy(f){const o=camera.position.clone().sub(controls.target).multiplyScalar(f);const L=o.length();if(L<controls.minDistance||L>controls.maxDistance)return;camera.position.copy(controls.target).add(o);}
const pad=document.createElement('div');pad.className='pad';
pad.innerHTML='<button class="u" data-p="0,1" title="Move up (↑)" aria-label="Move up">▲</button><button class="zi" data-z="0.94" title="Zoom in (+)" aria-label="Zoom in">＋</button><button class="l" data-p="-1,0" title="Move left (←)" aria-label="Move left">◀</button><button class="c" data-reset="1" title="Reset view" aria-label="Reset view">⟲</button><button class="r" data-p="1,0" title="Move right (→)" aria-label="Move right">▶</button><button class="d" data-p="0,-1" title="Move down (↓)" aria-label="Move down">▼</button><button class="zo" data-z="1.065" title="Zoom out (−)" aria-label="Zoom out">－</button>';
stage.appendChild(pad);
let padT=null;const padStop=()=>{clearInterval(padT);padT=null;};
pad.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();anim=null;
  if(b.dataset.reset){setView(Object.keys(VIEWS)[0]);return;}
  const step=b.dataset.p?()=>{const[x,y]=b.dataset.p.split(',').map(Number);panBy(x,y);}:()=>zoomBy(+b.dataset.z);step();padStop();padT=setInterval(step,40);});
['pointerup','pointerleave','pointercancel'].forEach(ev=>pad.addEventListener(ev,padStop));window.addEventListener('blur',padStop);
window.addEventListener('keydown',e=>{const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))return;
  const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[e.key];
  if(k){e.preventDefault();anim=null;panBy(k[0]*1.5,k[1]*1.5);return;}
  if(e.key==='+'||e.key==='='){zoomBy(0.88);}else if(e.key==='-'||e.key==='_'){zoomBy(1.14);}});

/* theme → scene background */
function syncTheme(){scene.background=new THREE.Color(cssv('--scene')||'#cfd8dc');}
syncTheme();
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncTheme);}catch(e){}
new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* resize */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();

/* loop */
const selTag=$('#seltag');const tmp=new THREE.Vector3();const ease=t=>1-Math.pow(1-t,3);
function frame(now){
  if(anim){const k=Math.min(1,(now-anim.t0)/anim.dur);const e=ease(k);controls.target.lerpVectors(anim.ft,anim.tt,e);camera.position.lerpVectors(anim.fp,anim.tp,e);if(k>=1)anim=null;}
  controls.update();
  if(pend){const id=pick(pend.x,pend.y);const r=stage.getBoundingClientRect();if(id!==state.hover){state.hover=id;applyLook();}
    if(id){tip.hidden=false;tip.textContent=ITEMS[id].name;tip.style.left=(pend.x-r.left)+'px';tip.style.top=(pend.y-r.top)+'px';}else tip.hidden=true;pend=null;}
  if(state.sel){const it=ITEMS[state.sel];const box=new THREE.Box3();it.meshes.forEach(m=>box.expandByObject(m));box.getCenter(tmp);tmp.y=box.max.y;tmp.project(camera);
    if(tmp.z<1&&groups[it.layer].visible){selTag.hidden=false;selTag.textContent=it.name;selTag.style.left=((tmp.x+1)/2*stage.clientWidth)+'px';selTag.style.top=((1-tmp.y)/2*stage.clientHeight)+'px';}else selTag.hidden=true;}
  else selTag.hidden=true;
  renderer.render(scene,camera);requestAnimationFrame(frame);}
renderLayers();renderRegions();
select('n_sciatic');
requestAnimationFrame(frame);
})();
</script>
