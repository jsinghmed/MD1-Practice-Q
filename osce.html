<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSCE Room · CRS</title>
<style>
:root{--navy:#1c4a72;--navy2:#285f8f;--bg:#eef2f6;--card:#fff;--ink:#1d2733;--mute:#5d6b7a;--ok:#1f8a4c;--part:#c27c0e;--miss:#c0392b;--line:#d8e0e8}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px}
header h1{font-size:17px;margin:0;font-weight:600}
header .sp{flex:1}
#timer{font-variant-numeric:tabular-nums;background:rgba(255,255,255,.14);padding:3px 10px;border-radius:6px;font-weight:600}
#timer.low{background:#c0392b}
main{max-width:1180px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.btn{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--navy);color:#fff}
.btn.sec{background:#e3eaf2;color:var(--navy)}
.btn.red{background:#c0392b}
.btn:disabled{opacity:.45;cursor:default}
h2{margin:0 0 10px;font-size:20px}
h3{margin:18px 0 8px;font-size:16px;color:var(--navy)}
.muted{color:var(--mute)}
/* dashboard */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.station{cursor:pointer;transition:.15s}
.station:hover{border-color:var(--navy2);box-shadow:0 2px 10px rgba(28,74,114,.12)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:#e3eaf2;color:var(--navy);margin-right:4px}
.soon{opacity:.55;cursor:default}
/* door */
.door{display:grid;grid-template-columns:1fr 280px;gap:18px}
.doornote{border-left:5px solid var(--navy);background:#f7fafc;padding:14px 16px;border-radius:6px}
.doornote dt{font-weight:600;margin-top:8px}
.doornote dd{margin:2px 0 0}
.doorpic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(#8a6a4b,#6d5238);border-radius:10px;padding:20px;color:#fff;min-height:320px}
.doorpic .plate{background:#f3efe6;color:#333;padding:6px 14px;border-radius:4px;font-weight:600;font-size:13px}
/* room */
.room{display:grid;grid-template-columns:minmax(300px,1fr) 1.15fr;gap:16px}
.scene{position:relative;border-radius:10px;overflow:hidden;background:#e9ecef;min-height:420px;aspect-ratio:400/520;display:flex;align-items:flex-start}
.scene svg{width:100%;height:auto;display:block}
.bubble{position:absolute;left:14px;right:14px;bottom:14px;background:#fff;border-radius:10px;padding:10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.15);min-height:44px;font-size:14.5px}
.bubble b{color:var(--navy)}
.panel{display:flex;flex-direction:column;gap:12px}
.mic{display:flex;align-items:center;gap:12px}
#micBtn{width:64px;height:64px;border-radius:50%;font-size:26px;padding:0;flex:none}
#micBtn.on{background:#c0392b;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,57,43,.5)}70%{box-shadow:0 0 0 14px rgba(192,57,43,0)}100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}}
#interim{color:var(--mute);font-style:italic;min-height:22px}
.typer{display:flex;gap:8px}
.typer input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}
#log{height:250px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fafcfe}
.msg{margin:0 0 8px}
.msg.you b{color:#555}
.msg.pt b{color:var(--navy)}
.msg.sys{color:var(--mute);font-size:13px}
#findings{display:flex;flex-direction:column;gap:6px}
.find{background:#f1f7f2;border-left:4px solid var(--ok);padding:6px 10px;border-radius:4px;font-size:14px}
.find b{display:block;font-size:12.5px;color:var(--ok);text-transform:uppercase;letter-spacing:.03em}
.phase{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:3px 10px;border-radius:12px;background:#e3eaf2;color:var(--navy)}
.chip.done{background:var(--navy);color:#fff}
/* report */
.score{display:flex;gap:14px;flex-wrap:wrap}
.score .big{font-size:36px;font-weight:700;color:var(--navy)}
.sbox{flex:1;min-width:170px;background:#f7fafc;border:1px solid var(--line);border-radius:8px;padding:12px}
table.rub{width:100%;border-collapse:collapse;font-size:14px}
table.rub td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.rub td.pts{width:58px;text-align:center;font-weight:700}
.p2{color:var(--ok)}.p1{color:var(--part)}.p0{color:var(--miss)}.pna{color:var(--mute)}
.tip{color:var(--mute);font-size:13px}
.kpt{background:#fff8e6;border-left:4px solid #e0a800;padding:10px 14px;border-radius:4px}
.hide{display:none!important}
@media(max-width:820px){.door,.room{grid-template-columns:1fr}}
</style>
</head>

<script>
/* ============================================================

const RUBRIC = {

];
function mnemoResults(c){
  const said=S.log.filter(([w])=>w==="You").map(([,t])=>t);
  return MNEMO.map(([g,items])=>[g,items.map(([L,label,re])=>({L,label,na:/Gynecological/.test(label)&&c.patient.sex==="male",ok:!!re&&said.some(t=>re.test(t))}))]);
}

},
{id:"crs-hf", module:"CRS", title:"Shortness of breath and swollen ankles", soon:true},
{id:"crs-palp", module:"CRS", title:"Palpitations", soon:true}];

/* ============================================================
   Engine
   ============================================================ */
const $ = s=>document.querySelector(s), app=$("#app");
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
let S=null, rec=null, recOn=false, speaking=false, tick=null;

function dash(){
  stopAll(); $("#timer").classList.add("hide");
  let hist=[]; try{hist=JSON.parse(localStorage.getItem("osce-hist")||"[]")}catch(e){}
  app.innerHTML=`<h2>CRS stations</h2><p class="muted">Each station is scored on your CRS102 cardiovascular OSCE rubric. Talk to the patient out loud, examine by saying what you're doing, then give your assessment.</p>
  <div class="grid">${CASES.map(c=>`<div class="card station ${c.soon?"soon":""}" data-c="${c.id}">
    <div><span class="tag">${c.module}</span>${c.soon?'<span class="tag">coming soon</span>':`<span class="tag">${c.minutes} min</span>`}</div>
    <h3 style="margin:8px 0 4px">${c.title}</h3>
    <div class="muted">${c.soon?"":c.door.Patient}</div>
    ${(()=>{const h=hist.filter(x=>x.id===c.id);return h.length?`<div class="tip" style="margin-top:6px">Best: ${Math.max(...h.map(x=>x.pct))}% · ${h.length} attempt${h.length>1?"s":""}</div>`:""})()}
  </div>`).join("")}</div>
  ${SR?"":`<p class="kpt" style="margin-top:16px">This browser can't transcribe speech, so you'll type instead. Use Chrome or Safari to talk out loud.</p>`}`;
  app.querySelectorAll(".station:not(.soon)").forEach(el=>el.onclick=()=>door(CASES.find(c=>c.id===el.dataset.c)));
}

function door(c){
  S={c, log:[], hit:{}, prof:{}, findings:{}, knocked:false, phase:"door", t0:null, dx:""};
  app.innerHTML=`<div class="door"><div class="card">
    <h2>Door note</h2>
    <dl class="doornote">${Object.entries(c.door).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    <details style="margin-top:12px"><summary style="cursor:pointer;font-weight:600;color:var(--navy)">Show the history mnemonics</summary>
      <div class="tip" style="margin-top:6px;line-height:1.7">${MNEMO.map(([g,items])=>`<b>${g}</b>: ${items.map(([L,l])=>`${L} = ${l}`).join(", ")}`).join("<br>")}</div></details>
    <p class="muted" style="margin-top:14px">You have ${c.minutes} minutes once you enter. Press the mic and talk as you would in the real station: greet, take the history, ask permission, then say each part of the exam out loud (for example “I'm going to percuss the left 3rd to 6th intercostal spaces”). The findings appear as you go.</p>
    <button class="btn sec" id="back">← All stations</button></div>
    <div class="doorpic"><div class="plate">Exam Room 3</div><div style="font-size:60px">🚪</div>
      <button class="btn sec" id="knock">✊ Knock</button><button class="btn" id="enter">Enter the room</button></div></div>`;
  $("#back").onclick=dash;
  $("#knock").onclick=()=>{S.knocked=true;$("#knock").textContent="✓ Knocked";$("#knock").disabled=true;knockSound();setTimeout(()=>say("Come in."),500)};
  $("#enter").onclick=room;
}

function room(){
  const c=S.c; S.phase="history"; S.t0=Date.now();
  app.innerHTML=`<div class="room">
    <div class="scene">${patientSVG()}<div class="bubble" id="bubble"><b>${c.patient.name}:</b> <span id="said">…</span></div></div>
    <div class="panel">
      <div class="phase" id="phase"></div>
      <div class="card"><div class="mic">
        <button class="btn" id="micBtn" title="Talk">🎙</button>
        <div style="flex:1"><div id="micState" class="muted">${SR?"Press the mic and start talking.":"Type what you'd say below."}</div><div id="interim"></div></div>
      </div>
      <div class="typer" style="margin-top:10px"><input id="txt" placeholder="…or type what you'd say and press Enter"><button class="btn sec" id="send">Send</button></div></div>
      <div id="log"></div>
      <div class="card"><h3 style="margin-top:0">Exam findings</h3><div id="findings"><span class="muted">Say what you examine and the findings will appear here.</span></div></div>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn red" id="end">End encounter → Assessment</button></div>
    </div></div>`;
  if(!SR) $("#micBtn").disabled=true;
  $("#micBtn").onclick=toggleMic;
  $("#txt").onkeydown=e=>{if(e.key==="Enter"&&e.target.value.trim()){heard(e.target.value.trim());e.target.value=""}};
  $("#send").onclick=()=>{const v=$("#txt").value.trim();if(v){heard(v);$("#txt").value=""}};
  $("#end").onclick=assess;
  startTimer(c.minutes); phaseChips();
  sys(S.knocked?"You knocked and entered.":"You entered without knocking.");
  say(c.opening);
}

function phaseChips(){
  const h=RUBRIC.history.filter(([k])=>S.hit[k]).length, e=RUBRIC.exam.filter(([k])=>S.hit[k]).length;
  $("#phase").innerHTML=`<span class="chip ${h?"done":""}">History ${h}/${RUBRIC.history.length}</span><span class="chip ${e?"done":""}">Exam ${e}/${RUBRIC.exam.length}</span><span class="chip ${S.prof.consent?"done":""}">Consent</span>`;
}

/* --- understanding what the student said --- */
function heard(text){
  if(S.phase==="assess"){ S.dx+=(S.dx?" ":"")+text; $("#dxText").value=S.dx; return; }
  add("you","You",text);
  const c=S.c, P=c.prof;
  // professionalism
  if(P.greet.test(text)||P.title.test(text)) S.hit.intro=Math.max(S.hit.intro||0, P.title.test(text)?2:1);
  for(const k of ["title","role","care","consent","thanks"]) if(P[k].test(text)) S.prof[k]=1;
  // exam: one or more manoeuvres in a sentence
  let examined=false;
  for(const [id,re,find,details,need] of c.exam){
    if(!re.test(text)) continue; examined=true;
    const got=details.filter(d=>d.test(text)).length;
    const pts=got>=need?2:1; S.hit[id]=Math.max(S.hit[id]||0,pts);
    if(!S.findings[id]){S.findings[id]=find; showFinding(id,find);}
  }
  if(examined && !S.prof.consent && !S.examWarned){S.examWarned=true;}
  // history: answer what was asked (up to 2 topics per sentence)
  const ans=[];
  if(!examined){
    for(const [id,re,reply,full] of c.intents){
      if(re.test(text)){ S.hit[id]=Math.max(S.hit[id]||0, full&&!full.test(text)?1:2); if(!ans.includes(reply) && ans.length<2) ans.push(reply); }
    }
  }
  phaseChips();
  if(ans.length) say(ans.join(" "));
  else if(examined) say(S.prof.consent?"Okay.":"Oh — okay.");
  else if(/thank/i.test(text)) say("Thank you, doctor.");
  else if(c.prof.consent.test(text)) say("Sure, go ahead.");
  else if(/\b(hi|hello|good (morning|afternoon|evening))\b|my name is|i'?m /i.test(text)) say("Nice to meet you.");
  else say("Sorry, could you ask me that another way?");
}

/* --- speech in --- */
function toggleMic(){
  if(recOn){recOn=false; try{rec.stop()}catch(e){} micUI(); return;}
  rec=new SR(); rec.lang="en-US"; rec.continuous=true; rec.interimResults=true;
  rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){const t=r[0].transcript.trim();if(t&&!speaking)heard(t)}else interim+=r[0].transcript}$("#interim").textContent=interim;};
  rec.onend=()=>{ if(recOn&&!speaking) try{rec.start()}catch(e){} };
  rec.onerror=e=>{ if(e.error==="not-allowed"){recOn=false;micUI();sys("Microphone blocked. Allow it in the browser, or type instead.");} };
  recOn=true; try{rec.start()}catch(e){} micUI();
}
function micUI(){ const b=$("#micBtn"); if(!b) return; b.classList.toggle("on",recOn); $("#micState").textContent=recOn?(speaking?"Patient is talking…":"Listening… talk normally."):"Mic off. Press to talk."; }

/* --- speech out --- */
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  return vs.find(v=>/daniel|alex|fred|aaron|arthur|male|david|guy/i.test(v.name))||vs[0];
}
function say(text){
  if(S && S.phase!=="door") add("pt",S.c.patient.name,text);
  const said=$("#said"); if(said) said.textContent=text;
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); const v=pickVoice(); if(v) u.voice=v; u.rate=.95; u.pitch=.85;
  u.onstart=()=>{speaking=true; mouth(true); if(rec&&recOn) try{rec.stop()}catch(e){} micUI();};
  u.onend=()=>{speaking=false; mouth(false); if(rec&&recOn) setTimeout(()=>{try{rec.start()}catch(e){}},250); micUI();};
  speechSynthesis.speak(u);
}
function knockSound(){ try{const a=new AudioContext();[0,.18,.36].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=95;g.gain.setValueAtTime(.6,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.12);o.connect(g).connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+.13)})}catch(e){} }

/* --- log --- */
function add(cls,who,text){ S.log.push([who,text]); const l=$("#log"); if(!l) return; l.insertAdjacentHTML("beforeend",`<p class="msg ${cls}"><b>${who}:</b> ${esc(text)}</p>`); l.scrollTop=l.scrollHeight; }
function sys(t){ const l=$("#log"); if(l){l.insertAdjacentHTML("beforeend",`<p class="msg sys">${t}</p>`);l.scrollTop=l.scrollHeight;} }
function showFinding(id,f){ const box=$("#findings"); if(!box) return; if(box.querySelector(".muted")) box.innerHTML="";
  const label=RUBRIC.exam.find(x=>x[0]===id)[1]; box.insertAdjacentHTML("beforeend",`<div class="find"><b>${label}</b>${f}</div>`); }
const esc=s=>s.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));

/* --- timer --- */
function startTimer(min){ const el=$("#timer"); el.classList.remove("hide","low"); clearInterval(tick); const end=Date.now()+min*60000;
  tick=setInterval(()=>{const s=Math.max(0,Math.round((end-Date.now())/1000)); el.textContent=`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
    el.classList.toggle("low",s<=120); if(s===0){clearInterval(tick); S.overtime=true; if(S.phase==="history"){sys("⏰ Time is up."); assess();}}},500); }
function stopAll(){ clearInterval(tick); recOn=false; try{rec&&rec.stop()}catch(e){} if("speechSynthesis" in window) speechSynthesis.cancel(); }

/* --- assessment --- */
function assess(){
  S.phase="assess"; S.used=Math.round((Date.now()-S.t0)/1000); if("speechSynthesis" in window) speechSynthesis.cancel();
  if(!S.prof.thanks && S.log.slice(-3).some(([w,t])=>w==="You"&&/thank/i.test(t))) S.prof.thanks=1;
  app.innerHTML=`<div class="card"><h2>Your assessment</h2>
    <p class="muted">You've left the room. Tell the examiner your most likely diagnosis, why, and what you'd do next. Use the mic or type.</p>
    <div class="mic"><button class="btn" id="micBtn">🎙</button><div style="flex:1"><div id="micState" class="muted">Press the mic and talk.</div><div id="interim"></div></div></div>
    <textarea id="dxText" rows="5" style="width:100%;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit" placeholder="e.g. “Most likely stable angina because…”"></textarea>
    <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn" id="grade">Submit and see my grade</button></div></div>`;
  if(!SR) $("#micBtn").disabled=true;
  $("#micBtn").onclick=toggleMic;
  $("#dxText").oninput=e=>S.dx=e.target.value;
  $("#grade").onclick=()=>{S.dx=$("#dxText").value; stopAll(); report();};
}

/* --- grading --- */
function report(){
  const c=S.c; const P=S.prof; P.knock=S.knocked?1:0;
  const sec=(list,max)=>list.map(([k,label,self])=>({k,label,self,p:self?null:(max===2?(S.hit[k]||0):(P[k]||0)),max}));
  const H=sec(RUBRIC.history,2), E=sec(RUBRIC.exam,2), R=sec(RUBRIC.prof,1);
  const sum=a=>a.filter(x=>!x.self).reduce((s,x)=>s+x.p,0), mx=a=>a.filter(x=>!x.self).reduce((s,x)=>s+x.max,0);
  const dxBest=c.dx.best.test(S.dx), dxGood=c.dx.good.filter(r=>r.test(S.dx)).length;
  const dxPts=(dxBest?2:0)+Math.min(dxGood,3); // out of 5
  const tot=sum(H)+sum(E)+sum(R)+dxPts, totMax=mx(H)+mx(E)+mx(R)+5, pct=Math.round(100*tot/totMax);
  try{const h=JSON.parse(localStorage.getItem("osce-hist")||"[]");h.push({id:c.id,pct,at:Date.now()});localStorage.setItem("osce-hist",JSON.stringify(h.slice(-50)))}catch(e){}
  const row=x=>`<tr><td class="pts ${x.self?"pna":"p"+(x.max===1?x.p*2:x.p)}">${x.self?"self":x.p+"/"+x.max}</td><td>${x.label}${!x.self&&x.p<x.max&&HOW[x.k]?`<div class="tip">${x.p?"Partly done. ":""}${HOW[x.k]}</div>`:""}${x.self?`<div class="tip">Can't be judged from audio. Check yourself.</div>`:""}</td></tr>`;
  const missed=[...H,...E].filter(x=>!x.self&&x.p===0).map(x=>x.label), partial=[...H,...E].filter(x=>x.p===1).map(x=>x.label);
  const strong=[...H,...E,...R].filter(x=>!x.self&&x.p===x.max).length;
  const fb=(p,lo,hi)=>p>=hi?"excellent":p>=lo?"on par with the expected level":"not yet at the expected level";
  const mm=Math.floor(S.used/60), ss=S.used%60;
  app.innerHTML=`<div class="card">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0;flex:1">Your grade: ${c.title}</h2><button class="btn sec" id="again">Try again</button><button class="btn sec" id="home">All stations</button></div>
    <div class="score" style="margin-top:14px">
      <div class="sbox"><div class="big">${pct}%</div><div class="muted">${tot} / ${totMax} points · ${mm}:${String(ss).padStart(2,"0")} used</div></div>
      <div class="sbox"><b>History</b><div class="big" style="font-size:24px">${sum(H)}/${mx(H)}</div></div>
      <div class="sbox"><b>Exam</b><div class="big" style="font-size:24px">${sum(E)}/${mx(E)}</div></div>
      <div class="sbox"><b>Professionalism</b><div class="big" style="font-size:24px">${sum(R)}/${mx(R)}</div></div>
      <div class="sbox"><b>Assessment</b><div class="big" style="font-size:24px">${dxPts}/5</div></div>
    </div>
    <h3>Examiner feedback</h3>
    <ul>
      <li><b>Clinical skills:</b> ${fb((sum(H)+sum(E))/(mx(H)+mx(E)),.6,.85)}.</li>
      <li><b>Medical knowledge:</b> ${dxBest&&dxGood>=2?"excellent":dxBest?"on par with the expected level":"not yet at the expected level"}${dxBest?"":" (the most likely diagnosis was not stated)"}.</li>
      <li><b>Professionalism &amp; communication:</b> ${fb(sum(R)/mx(R),.5,.85)}.</li>
      <li><b>Did well:</b> ${strong} items done fully.${S.knocked?" You knocked before entering.":""}${P.consent?" You asked permission before examining.":""}</li>
      ${missed.length?`<li><b>Missed (${missed.length}):</b> ${missed.join(", ")}.</li>`:""}
      ${partial.length?`<li><b>Done but incomplete:</b> ${partial.join(", ")}.</li>`:""}
    </ul>
    <h3>History mnemonics: NAME · GHORD · CC LORD AFACAST · PCAST · BIG DT</h3>
    ${(()=>{const M=mnemoResults(c);const all=M.flatMap(([,i])=>i).filter(x=>!x.na);const got=all.filter(x=>x.ok).length;
      return `<p class="muted" style="margin:0 0 8px">You covered ${got} of ${all.length} mnemonic items. These aren't part of the rubric score.</p><table class="rub">`+M.map(([g,items])=>`<tr><td style="width:96px;font-weight:700;color:var(--navy)">${g}</td><td>${items.map(x=>`<span style="display:inline-block;margin:2px 10px 2px 0" class="${x.na?"pna":x.ok?"p2":"p0"}">${x.na?"–":x.ok?"✓":"✗"} <b>${x.L}</b> ${x.label}${x.na?" (n/a, male patient)":""}</span>`).join("")}</td></tr>`).join("")+`</table>`;})()}
    <h3>Case teaching points</h3><div class="kpt">${c.dx.teach.map(t=>`<p style="margin:4px 0">${t}</p>`).join("")}</div>
    <h3>History (0–2 each)</h3><table class="rub">${H.map(row).join("")}</table>
    <h3>Cardiovascular exam (0–2 each)</h3><table class="rub">${E.map(row).join("")}</table>
    <h3>Professionalism (0–1 each)</h3><table class="rub">${R.map(row).join("")}</table>
    <h3>Your assessment</h3><p>${S.dx?esc(S.dx):'<span class="muted">Nothing given.</span>'}</p>
    <h3>Transcript</h3><div style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px">${S.log.map(([w,t])=>`<p class="msg"><b>${w}:</b> ${esc(t)}</p>`).join("")||'<span class="muted">Empty</span>'}</div>
  </div>`;
  $("#timer").classList.add("hide");
  $("#again").onclick=()=>door(c); $("#home").onclick=dash;
}

let mouthT=null;
function mouth(on){ const inn=document.getElementById("mouthIn"), lo=document.getElementById("lowLip"); if(!inn) return; clearInterval(mouthT);
  const set=o=>{inn.setAttribute("d",`M188 150 q12 ${2+o} 24 0 q-12 ${-1+o*0.2} -24 0z`); lo.setAttribute("d",`M189 ${151+o*0.7} q11 ${5+o*0.4} 22 0`);};
  if(on) mouthT=setInterval(()=>set(Math.random()*7),110); else set(0); }

if("speechSynthesis" in window) speechSynthesis.onvoiceschanged=()=>{};
/* Only approved accounts: the page must be opened inside JJ QBank while signed in as an allowed email */
const OSCE_USERS=["jasjot.sayal@student.windsor.edu"];
function osceGate(n){
  let u=null; try{ if(window.parent!==window && window.parent.firebase && window.parent.firebase.auth) u=window.parent.firebase.auth().currentUser; }catch(e){}
  if(u && u.email && OSCE_USERS.includes(u.email.toLowerCase())) { dash(); return; }
  if((n||0)<12){ setTimeout(()=>osceGate((n||0)+1),400); return; }
  app.innerHTML=`<div class="card" style="max-width:560px;margin:40px auto;text-align:center"><div style="font-size:40px">🔒</div><h2>OSCE Room</h2><p class="muted">This area is only available to approved accounts. Open it from JJ QBank while signed in.</p></div>`;
}
