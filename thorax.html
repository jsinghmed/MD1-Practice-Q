<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thorax Anatomy · JJ QBank</title>
<script>function jjTheme(){try{var th=localStorage.getItem("msk-theme");document.documentElement.setAttribute("data-theme",th==="light"?"light":"dark");}catch(e){}}jjTheme();window.addEventListener("storage",function(e){if(e.key==="msk-theme")jjTheme();});window.addEventListener("message",function(e){if(e.data==="jj-theme")jjTheme();});</script>
<style>
:root{--bg:#0d1117;--panel:#161b22;--card:#11161d;--choice:#1a2029;--choice-h:#202733;--teal:#4fb8b0;--teal-ink:#0b1416;--line:#2a313c;--line2:#353d4a;--text:#e6edf3;--muted:#8b949e;--good:#2ea043;--bad:#d1453b;--red:#ff7b72;--h2:#5fc4bb;--h3:#a5c9c6;
 --c-key:#12303a;--c-key-b:#3aa0b0;--c-pearl:#2c2a12;--c-pearl-b:#d6b43a;--c-clin:#35191a;--c-clin-b:#d1584f;--c-mnem:#271c33;--c-mnem-b:#a77bd0;--c-watch:#33270f;--c-watch-b:#d69a2d}
:root[data-theme="light"]{--bg:#f3f5f8;--panel:#fff;--card:#fff;--choice:#f6f8fa;--choice-h:#eef1f4;--teal:#2b9a91;--teal-ink:#fff;--line:#d8dee4;--line2:#c4ccd5;--text:#1f2328;--muted:#59636e;--red:#c00000;--h2:#0f6068;--h3:#2e4a4c;
 --c-key:#e6f2f4;--c-pearl:#fff8dd;--c-clin:#fbe7e6;--c-mnem:#f2ecf7;--c-watch:#fff3dc}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:26px 22px 80px}
.crumb{font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
h1{font-size:28px;line-height:1.25;margin:6px 0 4px}
.steps{display:flex;gap:8px;margin:14px 0 26px;flex-wrap:wrap}
.steps button{border:1px solid var(--line2);background:var(--choice);border-radius:20px;padding:6px 14px;font-weight:600;font-size:14px}
.steps button.on{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.guide h2{font-size:22px;color:var(--h2);margin:34px 0 10px;line-height:1.3}
.guide h3{font-size:18px;color:var(--h3);margin:24px 0 8px}
.guide p{margin:0 0 12px}.guide ul{margin:0 0 14px;padding-left:22px}.guide li{margin:5px 0}
.guide .r{color:var(--red)}
.guide figure{margin:18px 0 6px;background:#fff;border-radius:10px;padding:10px;text-align:center}
.guide figure img{max-width:100%;height:auto;display:inline-block}
.guide figcaption{font-size:13.5px;color:var(--muted);text-align:center;margin:0 0 18px}
.guide table{width:100%;border-collapse:collapse;margin:10px 0 18px;font-size:14.5px;line-height:1.45}
.guide th{background:#0f6068;color:#fff;text-align:left;padding:8px 10px}
.guide td{border:1px solid var(--line2);padding:7px 10px;vertical-align:top}
.guide tr:nth-child(even) td{background:color-mix(in srgb,var(--choice) 70%,transparent)}
.tw{overflow-x:auto}
.call{border-left:4px solid;border-radius:0 8px 8px 0;padding:11px 14px;margin:12px 0 16px}
.call.key{background:var(--c-key);border-color:var(--c-key-b)}.call.pearl{background:var(--c-pearl);border-color:var(--c-pearl-b)}
.call.clin{background:var(--c-clin);border-color:var(--c-clin-b)}.call.mnem{background:var(--c-mnem);border-color:var(--c-mnem-b)}.call.watch{background:var(--c-watch);border-color:var(--c-watch-b)}
.call > b:first-child{color:var(--muted)}
.call.key > b:first-child{color:var(--c-key-b)}.call.pearl > b:first-child{color:var(--c-pearl-b)}.call.clin > b:first-child{color:var(--c-clin-b)}.call.mnem > b:first-child{color:var(--c-mnem-b)}.call.watch > b:first-child{color:var(--c-watch-b)}
.toq{margin:34px 0 0;padding:18px;border:1px solid color-mix(in srgb,var(--teal) 50%,var(--line2));border-radius:12px;background:color-mix(in srgb,var(--teal) 10%,var(--card));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.toq b{font-size:17px}.toq small{display:block;color:var(--muted)}.toq .sp{flex:1}
.btn{border:1px solid var(--line2);background:var(--choice);border-radius:9px;padding:9px 16px;font-weight:600}
.btn.pri{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}.btn:disabled{opacity:.45;cursor:default}
.qnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.qnav button{width:36px;height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--choice);font-weight:600;font-size:13px}
.qnav button.cur{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.qnav button.ok{background:color-mix(in srgb,var(--good) 30%,var(--choice))}.qnav button.no{background:color-mix(in srgb,var(--bad) 30%,var(--choice))}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.qcard .qh{font-weight:700;color:var(--h2);margin-bottom:6px}
.stem{font-size:16.5px;margin:0 0 16px}
.opt{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:11px 14px;border:1px solid var(--line2);border-radius:10px;margin-bottom:8px;background:var(--choice);cursor:pointer;line-height:1.45}
.opt:hover{background:var(--choice-h)}.opt:focus-visible{outline:2px solid var(--teal)}
.opt .l{font-weight:700;color:var(--muted);flex:none;width:18px}
.opt.sel{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--choice))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--choice))}
.opt[aria-disabled="true"]{cursor:default}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.exp{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--choice);border:1px solid var(--line2)}
.exp .v{font-weight:700;margin-bottom:4px}.exp .v.ok{color:var(--good)}.exp .v.no{color:var(--bad)}
.done{text-align:center;padding:26px}.done .big{font-size:40px;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:60px 20px}
.tools{position:sticky;top:0;z-index:5;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 0 10px;margin:-6px 0 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.tools .lb{font-size:12px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-right:2px}
.tools button{border:1px solid var(--line2);background:var(--choice);border-radius:16px;padding:5px 11px;font-size:13px;font-weight:600}
.tools button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.guide.hidered .r{background:color-mix(in srgb,var(--red) 22%,var(--choice));color:transparent;border-radius:4px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone;transition:color .15s}
.guide.hidered .r.rev{background:transparent;color:var(--red);cursor:default}
.guide.hidered .r b,.guide.hidered .r i{color:inherit}
.tq{display:flex;justify-content:flex-end;margin:6px 0 -6px}.tq button{background:none;border:0;color:var(--teal);font-weight:600;font-size:13px;padding:2px 0}
table.quiz td.hid{background:color-mix(in srgb,var(--teal) 16%,var(--choice))!important;color:transparent;cursor:pointer;position:relative}
table.quiz td.hid *{color:transparent}
table.quiz td.hid::after{content:"tap to reveal";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px}
.fig{position:relative;display:inline-block;max-width:100%}.fig img{display:block;max-width:100%}
.mk{position:absolute;background:#26394a;border-radius:3px;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.mk:hover{background:#1f6f74}.mk.rev{background:transparent;box-shadow:0 0 0 2px #4fb8b0;cursor:default}
.chk{margin:20px 0 26px;border:1px solid color-mix(in srgb,var(--teal) 45%,var(--line2));border-radius:12px;padding:14px 16px;background:color-mix(in srgb,var(--teal) 7%,var(--card))}
.chk .ht{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
.chk .cq{margin:10px 0 14px}.chk .cq:last-child{margin-bottom:0}.chk .cq p{margin:0 0 8px;font-weight:600}
.chk .co{all:unset;box-sizing:border-box;display:block;width:100%;padding:8px 12px;border:1px solid var(--line2);border-radius:9px;margin-bottom:6px;background:var(--choice);cursor:pointer;font-size:15px;line-height:1.4}
.chk .co:hover{background:var(--choice-h)}.chk .co.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--choice))}.chk .co.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--choice))}
.chk .crs{background:none;border:0;color:var(--teal);font-weight:600;font-size:13px;padding:6px 0 0;cursor:pointer}.chk .ht .crs.all{float:right;padding:0;font-size:12px;letter-spacing:0;text-transform:none}
.chk .ce{font-size:14px;color:var(--muted);margin-top:4px}.chk .ce b{color:var(--text)}
@media (max-width:600px){.wrap{padding:18px 14px 60px}h1{font-size:23px}body{font-size:15.5px}}
</style></head>
<body>
<div class="wrap" id="app"><div class="empty">Loading the study guide…</div></div>
<script>
// Content comes from window.THX (set by the page that loads it), never from a public file.
const KEY="jj-thorax-v1";const LET="ABCDEFGH";
let S={ch:1,tab:"guide",ans:{},q:{},hideRed:false,hideLab:false,chk:{}};try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}try{if(window.parent!==window)window.parent.postMessage({jjThx:"changed"},"*");}catch(e){}};
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let CH=[];
function chap(){return CH.find(c=>c.n===S.ch)||CH[0];}
function guideHTML(c){
  let h=c.html.replace(/<table>/g,'<div class="tq"><button data-tq>Quiz me on this table</button></div><div class="tw"><table>').replace(/<\/table>/g,'</table></div>');
  let fi=0;h=h.replace(/<figure><img src="([^"]+)" alt=""><\/figure>/g,(m,src)=>{const k=fi++;if(c.masksJ&&!c.masks){try{c.masks=JSON.parse(c.masksJ);}catch(e){}}const ms=(c.masks&&c.masks[k])||[];
    return `<figure><span class="fig">${'<img src="'+src+'" alt="">'}${S.hideLab?ms.map((b,j)=>`<span class="mk" data-mk style="left:${b[0]*100}%;top:${b[1]*100}%;width:${b[2]*100}%;height:${b[3]*100}%"></span>`).join(""):""}</span></figure>`;});
  // quick checks go at the end of their section (just before the next h2)
  const parts=h.split(/(?=<h2>)/);const K=c.checks||[];const A=(S.chk[c.n]||{});
  return parts.map(p=>{const m=p.match(/^<h2>(.*?)<\/h2>/);if(!m)return p;const t=m[1].replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&quot;/g,'"');
    const ks=K.map((k,i)=>[k,i]).filter(([k])=>k.after===t);if(!ks.length)return p;
    return p+`<div class="chk"><div class="ht">✓ Quick check${ks.filter(([k,i])=>A[i]!==undefined).length>1?`<button class="crs all" data-ckra="${ks.map(([k,i])=>i).join(",")}">↺ Reset all</button>`:""}</div>${ks.map(([k,i])=>{const a=A[i];return `<div class="cq"><p>${esc(k.q)}</p>${k.c.map((o,j)=>`<button class="co ${a===undefined?"":j===k.a?"ok":j===a?"no":""}" data-ck="${i}" data-co="${j}">${esc(o)}</button>`).join("")}${a!==undefined?`<div class="ce"><b>${a===k.a?"Correct.":"Not quite."}</b> ${esc(k.e)}</div><button class="crs" data-ckr="${i}">↺ Reset this question</button>`:""}</div>`;}).join("")}</div>`;}).join("");}
function render(scrollTop){const c=chap();if(!c){$("app").innerHTML='<div class="empty">No content.</div>';return;}
  const A=S.ans[c.n]||{},qi=S.q[c.n]||0,nd=Object.keys(A).length,nr=c.quiz.filter(q=>A[q.n]===q.a).length;
  let h=`<div class="crumb">CRS Anatomy · Thorax study guide · Chapter ${c.n} of ${CH.length}</div><h1>${esc(c.title)}</h1>
  <div class="steps"><button class="${S.tab==="guide"?"on":""}" data-tab="guide">1 · Study guide</button><button class="${S.tab==="quiz"?"on":""}" data-tab="quiz">2 · Practice questions (${nd}/${c.quiz.length})</button></div>`;
  if(S.tab==="guide"){
    h+=`<div class="tools"><span class="lb">Test yourself</span><button id="tRed" aria-pressed="${!!S.hideRed}">Hide red text</button><button id="tLab" aria-pressed="${!!S.hideLab}">Hide diagram labels</button>${S.hideRed||S.hideLab?`<button id="tAll">Reveal all</button>`:""}</div>
    <div class="guide ${S.hideRed?"hidered":""}" id="guide">${guideHTML(c)}</div>
    <div class="toq"><div><b>Finished reading?</b><small>Test yourself on this chapter with 10 practice questions.</small></div><span class="sp"></span><button class="btn pri" id="go">Start the questions ›</button></div>`;
  } else if(qi>=c.quiz.length){
    h+=`<div class="qcard done"><div class="crumb">Chapter ${c.n} complete</div><div class="big">${nr} / ${c.quiz.length}</div><div class="row" style="justify-content:center"><button class="btn" id="review">Review answers</button><button class="btn" id="retry">Try again</button>${c.n<CH.length?`<button class="btn pri" id="nextch">Next chapter ›</button>`:""}</div></div>`;
  } else {
    const q=c.quiz[qi],a=A[q.n],done=a!==undefined;
    h+=`<div class="qnav">${c.quiz.map((x,j)=>`<button class="${j===qi?"cur":""} ${A[x.n]===undefined?"":A[x.n]===x.a?"ok":"no"}" data-j="${j}">${x.n}</button>`).join("")}</div>
    <div class="qcard"><div class="qh">Question ${q.n}</div><p class="stem">${esc(q.s)}</p>
    ${q.c.map((o,j)=>`<div class="opt ${done?(j===q.a?"ok":j===a?"no":""):(st.sel===j?"sel":"")}" role="button" tabindex="0" data-o="${j}" aria-disabled="${done}"><span class="l">${LET[j]}</span><span>${esc(o)}</span></div>`).join("")}
    ${done?`<div class="exp"><div class="v ${a===q.a?"ok":"no"}">${a===q.a?"Correct.":"Incorrect."} The answer is ${LET[q.a]}.</div>${esc(q.e)}</div>
      <div class="row">${qi>0?`<button class="btn" id="prev">‹ Previous</button>`:""}<button class="btn pri" id="next">${qi<c.quiz.length-1?"Next question ›":"See score ›"}</button></div>`
     :`<div class="row"><button class="btn pri" id="sub" ${st.sel===null?"disabled":""}>Submit</button>${qi>0?`<button class="btn" id="prev">‹ Previous</button>`:""}</div>`}</div>`;
  }
  const y=window.scrollY;$("app").innerHTML=h;if(scrollTop)window.scrollTo(0,0);else window.scrollTo(0,y);
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f;};
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;save();render(true);});
  on("go",()=>{S.tab="quiz";save();render(true);});
  on("tRed",()=>{S.hideRed=!S.hideRed;save();render();});on("tLab",()=>{S.hideLab=!S.hideLab;save();render();});
  on("tAll",()=>{document.querySelectorAll(".guide .r").forEach(x=>x.classList.add("rev"));document.querySelectorAll(".mk").forEach(x=>x.classList.add("rev"));document.querySelectorAll("td.hid").forEach(x=>x.classList.remove("hid"));});
  const g=$("guide");if(g)g.addEventListener("click",e=>{
    const r=e.target.closest(".r");if(r&&g.classList.contains("hidered")){r.classList.add("rev");return;}
    const mk=e.target.closest("[data-mk]");if(mk){mk.classList.add("rev");return;}
    const td=e.target.closest("td.hid");if(td){td.classList.remove("hid");return;}
    const tq=e.target.closest("[data-tq]");if(tq){const t=tq.parentElement.nextElementSibling.querySelector("table");const on=!t.classList.contains("quiz");t.classList.toggle("quiz",on);
      t.querySelectorAll("tbody tr").forEach(tr=>[...tr.children].forEach((td,j)=>td.classList.toggle("hid",on&&j>0)));tq.textContent=on?"Show the whole table":"Quiz me on this table";return;}
    const rr=e.target.closest("[data-ckr],[data-ckra]");if(rr){const A=(S.chk[c.n]=S.chk[c.n]||{});(rr.dataset.ckra?rr.dataset.ckra.split(","):[rr.dataset.ckr]).forEach(i=>delete A[i]);save();const y=window.scrollY;render();window.scrollTo(0,y);return;}
    const co=e.target.closest("[data-ck]");if(co){const i=+co.dataset.ck;const A=(S.chk[c.n]=S.chk[c.n]||{});if(A[i]!==undefined)return;A[i]=+co.dataset.co;save();
      const box=co.closest(".chk");const y=window.scrollY;render();window.scrollTo(0,y);}
  });
  document.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{S.q[c.n]=+b.dataset.j;st.sel=null;save();render();});
  document.querySelectorAll(".opt").forEach(o=>{const pickIt=()=>{if(o.getAttribute("aria-disabled")==="true")return;st.sel=+o.dataset.o;document.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===o));const s=$("sub");if(s)s.disabled=false;};o.onclick=pickIt;o.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pickIt();}};});
  on("sub",()=>{const q=c.quiz[qi];(S.ans[c.n]=S.ans[c.n]||{})[q.n]=st.sel;st.sel=null;save();render();});
  on("next",()=>{S.q[c.n]=qi+1;st.sel=null;save();render(true);});
  on("prev",()=>{S.q[c.n]=qi-1;st.sel=null;save();render(true);});
  on("review",()=>{S.q[c.n]=0;save();render(true);});
  on("retry",()=>{S.ans[c.n]={};S.q[c.n]=0;save();render(true);});
  on("nextch",()=>{S.ch=c.n+1;S.tab="guide";save();render(true);});}
const st={sel:null};
window.thxOpen=(n,tab)=>{if(n)S.ch=n;if(tab)S.tab=tab;st.sel=null;save();render(true);};
addEventListener("message",e=>{const m=e.data;if(m&&m.jjThx==="open")window.thxOpen(m.ch,m.tab);if(m&&m.jjThx==="data"){CH=m.chapters;render(true);}});
if(window.THX){CH=window.THX;render(true);}
try{if(window.parent!==window)window.parent.postMessage({jjThx:"ready"},"*");}catch(e){}
</script>
</body></html>
