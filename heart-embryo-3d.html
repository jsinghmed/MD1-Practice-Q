// ---------- stages ----------
const STAGES=[
{t:"Trilaminar disc & notochordal process",d:"Week 3 · ~day 16–18",
 pts:["Three germ layers: <b>ectoderm</b> on top (facing the amniotic cavity), <b>mesoderm</b> in the middle, <b>endoderm</b> below (facing the yolk sac)","The <b>notochordal process</b> grows in the midline from the primitive node toward the cranial end","The ectoderm above it thickens into the <b>neural plate</b> → neural folds → neural tube","At the cranial end the <b>oropharyngeal membrane</b>: ectoderm and endoderm touch with no mesoderm between"],
 note:["Remember","The heart and every blood vessel come from <b>mesoderm</b>. Everything that follows happens in the cranial end of this disc."],
 q:["Which germ layer gives rise to the heart?",["Mesoderm","Endoderm","Ectoderm"],0,"The cardiovascular system is mesodermal (endoderm → gut and lungs, ectoderm → skin and nervous system)."]},
{t:"Intraembryonic coelom & cardiogenic area",d:"Week 3 · ~day 18–19",
 pts:["Spaces in the lateral plate mesoderm join into a <b>horseshoe-shaped intraembryonic coelomic cavity</b>","It splits the mesoderm into <b>somatopleuric</b> (parietal, toward the ectoderm) and <b>splanchnopleuric</b> (visceral, toward the endoderm) layers","The apex of the horseshoe becomes the <b>pericardial cavity</b>; the limbs become the pleural and peritoneal cavities","The <b>septum transversum</b> sits just above (cranial to) the apex","Cardiogenic cells gather in the <b>splanchnopleuric</b> mesoderm at the apex"],
 note:["Mnemonic","Splanchno = the organ side. The heart is an organ, so it comes from splanchnopleuric mesoderm."],
 q:["Exactly which layer of mesoderm forms the heart?",["Somatopleuric (parietal)","Splanchnopleuric (visceral)","Intermediate mesoderm"],1,"The heart forms in the splanchnopleuric (visceral) layer, on the endoderm side of the coelom."]},
{t:"Two endothelial heart tubes",d:"Week 3 · ~day 19–20",
 pts:["The cardiogenic cells undergo <b>grouping / compaction</b> into two cords that hollow out","The first layer to form is the innermost one: <b>2 endothelial heart tubes</b>","A mass of mesoderm, the <b>myoepicardial mantle</b>, wraps each tube: <i>myo</i> → myocardium, <i>epi</i> → epicardium (visceral pericardium)","The developing tubes are embedded in the septum transversum region, in front of the pericardial cavity"],
 note:["Layers","Endothelium, endocardium, myocardium and visceral pericardium are all splanchnopleuric. Only the <b>parietal pericardium</b> is somatopleuric."],
 q:["Which layer of the heart wall forms first?",["Myocardium","Endothelium","Epicardium"],1,"The two endothelial heart tubes come first; the myoepicardial mantle then wraps them."]},
{t:"Folding of the embryo",d:"Week 4 · ~day 21–22",
 pts:["<b>Cranio-caudal folding</b> swings the cranial end (heart and septum transversum) ventrally and caudally, about 180°","<b>Lateral folding</b> rolls the sides under, closing the gut tube and bringing the two heart tubes toward the midline","Before folding the heart tubes lie <b>behind</b> the developing gut; after folding they lie <b>in front</b> of it","The septum transversum ends up <b>below</b> the heart, where it forms part of the diaphragm and the liver","The ectoderm wrapping around brings somatopleuric mesoderm with it → <b>parietal pericardium</b>"],
 note:["Mnemonic","Before = Behind, After = Anterior."],
 q:["After folding, the heart lies ___ to the gut.",["Posterior","Anterior","Lateral"],1,"Before = Behind, After = Anterior."]},
{t:"One fused heart tube",d:"Week 4 · ~day 21–22",
 pts:["The two tubes meet in the midline and <b>fuse into a single heart tube</b>","It bulges into the pericardial cavity, hung from the back wall by the <b>dorsal mesocardium</b>","Its venous end (sinus venosus) stays <b>submerged in the septum transversum</b>","The tube starts beating around <b>day 22</b>: the heart is the first organ to work"],
 note:["Picture it","Endothelial tube inside, cardiac jelly, then the myoepicardial mantle outside: a tube within a tube."],
 q:["Where is the venous end of the heart tube embedded?",["Dorsal mesocardium","Septum transversum","Foregut"],1,"The sinus venosus, with both horns, is submerged in the septum transversum."]},
{t:"Segments of the heart tube",d:"Week 4",
 pts:["Blood enters at the venous end and leaves at the arterial end:","<b>Sinus venosus</b> → <b>primitive atrium</b> → <b>primitive ventricle</b> → <b>bulbus cordis</b> (conus below, truncus arteriosus above) → <b>aortic sac</b> → right and left horns → <b>right and left dorsal aortas</b>","The sinus venosus has right and left horns; each receives the vitelline, umbilical and common cardinal veins","Between the primitive atrium and ventricle is the <b>atrioventricular canal</b>"],
 note:["Mnemonic","Some People Prefer Coffee To Ale: Sinus · Primitive atrium · Primitive ventricle · Conus · Truncus · Aortic sac."],
 q:["Which part lies between the primitive ventricle and the aortic sac?",["Bulbus cordis","Sinus venosus","Primitive atrium"],0,"The bulbus cordis: conus below, truncus arteriosus above."]},
{t:"Looping of the heart tube",d:"Week 4 · ~day 23–28",
 pts:["The venous end is gradually <b>released</b> from the septum transversum and moves <b>superiorly and posteriorly</b>","The tube grows faster than the pericardial cavity, so it bends into a <b>bulboventricular loop</b> to the right","The atria end up <b>above and behind</b> the ventricles; the primitive ventricle moves left, the bulbus cordis right and forward","The heart leans to the left, so the <b>right dorsal aorta is obliterated</b>; the left dorsal aorta remains as the descending aorta"],
 note:["Clinical","If the loop bends to the left instead, the heart ends up on the right side: dextrocardia."],
 q:["Which dorsal aorta remains as the descending aorta?",["Right","Left","Both fuse equally"],1,"The heart leans left, the right dorsal aorta is obliterated, and the left one remains."]},
{t:"Fate of the sinus venosus",d:"Weeks 4–8",
 pts:["The <b>left horn</b> narrows (retrogression) and empties into the right horn → <b>coronary sinus</b>","The <b>right horn</b> enlarges and is incorporated into the <b>right atrium</b> as its smooth part; it receives the SVC and IVC","The venous valve → <b>valve of the IVC</b>, <b>crista terminalis</b> (a boundary ridge, not a valve) and <b>valve of the coronary sinus</b>","Smooth wall = sinus venosus (a vein); rough pectinate wall = primitive atrium; the crista terminalis marks the border"],
 note:["High yield","The sinus venosus forms part of the <b>right</b> atrium only. It does not contribute to the left atrium."],
 q:["The left horn of the sinus venosus becomes the…",["Superior vena cava","Coronary sinus","Crista terminalis"],1,"After retrogression it empties into the right horn and becomes the coronary sinus."]},
{t:"Endocardial cushions & AV canals",d:"Weeks 4–5",
 pts:["The <b>atrioventricular canal</b> joins the common atrium to the common ventricle","<b>Endocardial cushions</b> grow from its dorsal and ventral walls","They fuse into the <b>septum intermedium</b>, splitting the canal into <b>right and left AV canals</b>","The heart now looks like an hourglass: common atrium above, common ventricle below"],
 note:["Where the atria come from","Right atrium = sinus venosus + right AV canal + right half of the common atrium. Left atrium = left AV canal + left half of the common atrium + a small part of the pulmonary vein."],
 q:["Fused endocardial cushions form the…",["Septum primum","Septum intermedium","Septum secundum"],1,"Cushions proliferate → fuse → septum intermedium → right and left AV canals."]},
{t:"Septation of the atria",d:"Weeks 4–6",
 pts:["The thin <b>septum primum</b> grows down from the roof toward the cushions; the gap left is the <b>foramen (ostium) primum</b>","Before that gap closes, holes in the upper septum primum join into the <b>foramen (ostium) secundum</b>","The thick <b>septum secundum</b> grows down on the <b>right</b> side but stops short; the passage below its edge is the <b>foramen ovale</b>","Fetal blood: right atrium → foramen ovale → up between the two septa → foramen secundum → left atrium","After birth, left atrial pressure rises and presses the septum primum flap against the septum secundum, so they fuse"],
 note:["Defects","Patent foramen ovale: the flap fails to fuse with the septum secundum. Ostium secundum defect: excess resorption of the septum primum. Ostium primum defect: the septum primum fails to fuse with the cushions."],
 q:["The foramen primum and foramen secundum are both openings in the…",["Septum secundum","Septum primum","Septum intermedium"],1,"Primum = the flap with the holes; secundum = the wall."]},
{t:"Septation of the ventricles",d:"Weeks 4–7",
 pts:["The floor of the common ventricle folds up into the <b>muscular interventricular septum</b> (the larger, lower part)","It does not reach the septum intermedium, leaving the <b>interventricular foramen</b>","The gap is closed by the <b>membranous interventricular septum</b>, from the <b>endocardial cushions</b> plus the <b>trunco-conal swellings</b>","Most of the primitive ventricle → <b>left ventricle</b>; part of it plus the <b>conus</b> → <b>right ventricle</b>"],
 note:["Clinical","A gap in the membranous part is a membranous VSD, seen in tetralogy of Fallot and always in persistent truncus arteriosus."],
 q:["The membranous interventricular septum comes from…",["The floor of the ventricle","Endocardial cushions + trunco-conal swellings","The septum secundum"],1,"The muscular part rises from the floor; the membranous part closes the last gap."]},
{t:"Spiral septum & the fetal heart",d:"Weeks 5–8",
 pts:["<b>Neural crest cells</b> migrate to the heart and form the <b>trunco-conal swellings</b>","They fuse in a twisting way into the <b>spiral septum</b>, the only septum that spirals","It splits the conus and truncus: right → <b>pulmonary trunk</b> (outlet of the RV), left → <b>aorta</b> (outlet of the LV), twisted around each other","The swellings also help form the aortic and pulmonic valves and the last part of the membranous septum","Fetal shunts: the <b>foramen ovale</b> and the <b>ductus arteriosus</b> (left 6th arch) from the pulmonary trunk to the aorta"],
 note:["Clinical","No neural crest → no spiral septum → <b>persistent truncus arteriosus</b> (always with a membranous VSD). Incomplete migration → <b>tetralogy of Fallot</b>: Pulmonic stenosis, RV hypertrophy, Overriding aorta, VSD (PROVe)."],
 q:["The trunco-conal swellings are made by…",["Endocardial cushions","Neural crest cells","Septum transversum"],1,"Neural crest cells migrate to the heart and form the trunco-conal swellings."]}
];

const canvas=$("cv");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));

const camera=new THREE.PerspectiveCamera(35,1,0.05,400);
const controls=new THREE.OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=0.12;controls.minDistance=2.5;controls.maxDistance=60;
