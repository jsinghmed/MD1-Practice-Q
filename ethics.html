*{box-sizing:border-box}html,body{margin:0;height:100%}

.app{display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,1fr);height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 10px}
.pdfst{border:1px solid var(--line2);border-radius:10px;padding:10px;background:var(--card);font-size:13px}

.h{font-size:11px;letter-spacing:1.2px;color:var(--muted);margin:16px 6px 6px;font-weight:600}
.flt{display:flex;flex-wrap:wrap;gap:5px;padding:0 4px}
.flt button{border:1px solid var(--line2);background:transparent;border-radius:14px;padding:3px 9px;font-size:12px;color:var(--muted)}

.tp{width:100%;display:flex;justify-content:space-between;gap:8px;align-items:center;border:0;background:transparent;border-radius:7px;padding:7px 8px;font-size:13.5px;text-align:left}
.tp:hover{background:var(--choice)}.tp.on{background:color-mix(in srgb,var(--teal) 20%,transparent)}
.tp .n{font-size:11.5px;color:var(--muted);white-space:nowrap}
.qcol{overflow:auto;padding:22px 26px 40px;border-right:1px solid var(--line)}
.crumb{font-size:12px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
h1{font-size:22px;margin:4px 0 2px}
.msel{display:none;width:100%;margin:10px 0 0;padding:9px;border-radius:8px;border:1px solid var(--line2);background:var(--choice)}
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 16px}
.qnav button{min-width:32px;height:28px;padding:0 4px;border-radius:7px;border:1px solid var(--line2);background:var(--choice);font-size:12.5px;font-weight:600;position:relative}
.qnav button.cur{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.qnav button.ok{background:color-mix(in srgb,var(--good) 30%,var(--choice))}.qnav button.no{background:color-mix(in srgb,var(--bad) 30%,var(--choice))}
.qnav button.mk::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:#e0a800}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qn{font-size:19px;font-weight:700}.tag{font-size:12px;border:1px solid var(--line2);border-radius:20px;padding:2px 9px;color:var(--muted)}
.mark{margin-left:auto;border:1px solid var(--line2);background:transparent;border-radius:8px;padding:4px 10px;font-size:13px}
.mark.on{border-color:#e0a800;color:#e0a800}
.crop{margin-top:12px;background:var(--paper);border-radius:8px;padding:10px 12px;min-height:90px;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:10px}

.row{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--choice);border-radius:8px;padding:8px 14px;font-weight:600}

  if(st.doc){ph($("qimg"),[q.q]);if(done)ph($("eimg"),q.e);}
  if(st.doc){drawInto($("qimg"),[q.q]).then(()=>{if(done&&$("eimg"))drawInto2($("eimg"),q.e);});}}
let drawTok2=0;
async function drawInto2(el,segs){const tok=++drawTok2;const w=Math.max(260,el.clientWidth-24);const cs=[];for(const [p,box] of segs){cs.push(await cropCanvas(p,box,w));if(tok!==drawTok2)return;}el.innerHTML="";el.style.minHeight="";cs.forEach(c=>el.appendChild(c));}
let resetArm=0;function confirmReset(){const b=$("reset");if(Date.now()-resetArm<4000){resetArm=0;return true;}resetArm=Date.now();b.textContent="Tap again to reset all answers";setTimeout(()=>{if($("reset"))$("reset").textContent="Reset all answers";},4000);return false;}
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(st.doc)renderQ();},250);});

addEventListener("message",e=>{const m=e.data;if(!m||m.jjEth!=="set")return;
  if(m.topic!==undefined)S.topic=m.topic;if(m.flt)S.flt=m.flt;const L=list();
  if(m.n&&byN(m.n))S.cur=m.n;else if(L.length&&!L.some(q=>q.n===S.cur))S.cur=L[0].n;save();go(S.cur);});
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
if(!byN(S.cur))S.cur=1;
renderSide();renderQ();if(!isMob())showPage(1);
idbGet().then(async v=>{if(v&&v.blob){try{openPdf(await v.blob.arrayBuffer(),v.name,null);}catch(e){}}});
</script>
