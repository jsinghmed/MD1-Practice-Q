<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSK Summative</title>
<script>try{var th=localStorage.getItem("msk-theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --card:#11161d; --choice:#1a2029; --choice-h:#202733; --hover:#1c222b;
  --line:#2a313c; --line2:#353d4a; --text:#e6edf3; --muted:#8b949e; --dim:#6e7681;
  --blue:#58a6ff; --blue-btn:#5aa2f7; --blue-bg:#16263d; --blue-line:#2f5d99; --on-primary:#06152b;
  --green:#3fb950; --green-tile:#4caf50; --green-bg:#12261a; --on-green:#0b2410; --green-line:#235c33; --tag-ok:#0d2b16;
  --red:#f85149; --red-tile:#e5534b; --red-bg:#2d1517; --tag-bad:#3a1416;
  --mark:#f2cc60; --flag:#d29922; --flag-line:#6b4f10;
  --why-bg:#141a22; --wt:#c9d1d9; --key-bg:#221b0c; --key-fg:#e3c27a;
  --badge-fg:#d2a8ff; --badge-line:#5a3d8a; --badge-bg:#211830; --toast:#30363d; --pick:#3b4352;
}
:root[data-theme="light"]{
  --bg:#f3f5f8; --panel:#ffffff; --card:#ffffff; --choice:#f6f8fa; --choice-h:#eef1f4; --hover:#eef1f4;
  --line:#d8dee4; --line2:#c4ccd5; --text:#1f2328; --muted:#59636e; --dim:#8c959f;
  --blue:#0969da; --blue-btn:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff; --on-primary:#ffffff;
  --green:#1a7f37; --green-tile:#2da44e; --green-bg:#dafbe1; --on-green:#ffffff; --green-line:#4ac26b; --tag-ok:#c9f2d3;
  --red:#cf222e; --red-tile:#cf222e; --red-bg:#ffebe9; --tag-bad:#ffd8d3;
  --mark:#fff2a8; --flag:#9a6700; --flag-line:#d4a72c;
  --why-bg:#f6f8fa; --wt:#424a53; --key-bg:#fff8c5; --key-fg:#7d4e00;
  --badge-fg:#8250df; --badge-line:#c297ff; --badge-bg:#fbefff; --toast:#24292f; --pick:#c4ccd5;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:270px 70px 1fr;height:100vh}
.app.norail{grid-template-columns:270px 1fr}
.app.norail .rail{display:none}

/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 18px 14px}
.brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px}
.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}
.stools{padding:0 12px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.search{position:relative}
.search input{width:100%;background:var(--choice);border:1px solid var(--line2);border-radius:7px;color:var(--text);padding:8px 30px 8px 32px;font:inherit;font-size:14px}
.search input:focus{outline:none;border-color:var(--blue)}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:15px;padding:2px 6px;display:none}
.search.has .clr{display:block}
.srow{display:flex;gap:6px}
.sbtn{flex:1;background:transparent;border:1px solid var(--line2);border-radius:7px;padding:7px 6px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.sbtn:hover{background:var(--hover)}
.sbtn.on{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.sbtn.th{flex:0 0 58px}
.chap-h{padding:16px 9px 7px;color:var(--muted);font-size:11.5px;letter-spacing:1.4px;font-weight:600}
.chaps{flex:1;overflow:auto;padding:0 9px 10px}
.chap{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:6px;padding:9px 12px;margin-bottom:2px;text-align:left;font-size:14.5px}
.chap:hover{background:var(--hover)}
.chap .n{color:var(--muted);font-size:12.5px;flex:none}
.chap.on{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.chap.on .n{color:var(--blue)}
.chap.all{font-weight:600}
.chap.sub{font-style:italic;color:var(--muted)}
.chap.on.sub{color:var(--blue)}
.chap .n.done{color:var(--green)}
.rv{display:flex;gap:5px;flex-wrap:wrap;padding:0 3px 8px}
.rv button{font-size:12px;padding:4px 9px;border:1px solid var(--line2);border-radius:13px;background:transparent;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.rv button:hover{background:var(--hover);color:var(--text)}
.rv button b{color:var(--text);font-weight:700}
.rv button.on{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.rv button.on b{color:var(--blue)}
.rv button.zero{opacity:.55}
.side-foot{border-top:1px solid var(--line);padding:12px 16px;color:var(--muted);font-size:12px;line-height:1.55}
.side-foot b{color:var(--text);font-weight:600}

/* question rail */
.rail{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 0 24px;display:flex;flex-direction:column;align-items:center;gap:7px}
.rail-h{color:var(--muted);font-size:11px;letter-spacing:1.4px;font-weight:600;margin-bottom:4px}
.tile{position:relative;width:44px;height:30px;border-radius:5px;border:1px solid var(--line2);background:transparent;font-size:13px;font-weight:600;color:var(--muted);flex:none}
.tile:hover{border-color:var(--muted)}
.tile.ok{background:var(--green-tile);border-color:var(--green-tile);color:var(--on-green)}
.tile.bad{background:var(--red-tile);border-color:var(--red-tile);color:#fff}
.tile.pick{background:var(--pick);border-color:var(--pick);color:var(--text)}
.tile.cur{outline:2px solid var(--blue);outline-offset:2px}
.tile.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--flag);border:2px solid var(--panel)}

/* main */
.main{overflow:auto;padding:26px 36px 60px}
.mob{display:none;margin-bottom:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.top h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.3px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:transparent;border:1px solid var(--line2);border-radius:6px;padding:7px 13px;font-size:13.5px;color:var(--text);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.on{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.btn.danger{color:var(--red)}
.btn.primary{background:var(--blue-btn);border-color:var(--blue-btn);color:var(--on-primary);font-weight:600}
.stats{margin:14px 0 20px;color:var(--muted);font-size:15px}
.stats b{color:var(--text)} .stats .g{color:var(--green)} .stats .r{color:var(--red)}
.stats .note{display:block;margin-top:4px;font-size:13px;color:var(--dim)}
.timer{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--text);background:var(--choice);border:1px solid var(--line2);border-radius:6px;padding:2px 9px;margin-left:4px}
.timer.low{color:var(--red);border-color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px 26px;max-width:1100px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.qmeta{color:var(--muted);font-weight:600;font-size:14.5px}
.qmeta b{color:var(--text)}
.qtools{display:flex;gap:7px;flex-wrap:wrap}
.qtools .btn{padding:5px 11px;font-size:13px}
.qtools .btn.flagged{color:var(--flag);border-color:var(--flag-line)}
.qtools .btn:disabled{opacity:.4;cursor:default}
.qtools .btn:disabled:hover{background:transparent}
.stem{font-size:16.5px;line-height:1.75;margin:0 0 18px}
.stem p{margin:0 0 10px}
.stem p:last-child{margin-bottom:0}
.stem img.qimg{margin-top:12px}
.eh p{margin:0 0 8px;line-height:1.7;font-size:15.5px}
.stem mark{background:var(--mark);color:#1a1300;border-radius:2px;padding:0 1px}
.stem.hl-mode{cursor:text}
.stem.hl-mode mark{cursor:pointer}
.stem mark.hl-g,.sw.hl-g{background:#9fe0a0}
.stem mark.hl-b,.sw.hl-b{background:#a9d4ff}
.stem mark.hl-p,.sw.hl-p{background:#ffb8dc}
.stem mark.hl-o,.sw.hl-o{background:#ffc98f}
.sw.hl-y{background:var(--mark)}
.hlgroup{display:inline-flex;align-items:center;gap:6px}
.sws{display:inline-flex;gap:4px;align-items:center}
.sw{width:18px;height:18px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.sw.on{border-color:var(--text)}
.qimg{display:block;max-width:100%;max-height:440px;border-radius:6px;border:1px solid var(--line);margin:4px 0 20px;background:#fff;cursor:zoom-in}
.choices{display:flex;flex-direction:column;gap:9px}
.ch{display:flex;align-items:center;gap:14px;background:var(--choice);border:1px solid var(--line2);border-radius:7px;padding:11px 14px;cursor:pointer;user-select:none}
.ch:hover{background:var(--choice-h)}
.ch .L{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.ch .T{flex:1;font-size:15.5px;line-height:1.45}
.ch .x{flex:none;background:none;border:none;color:var(--dim);font-size:18px;padding:2px 6px;border-radius:4px;line-height:1}
.ch .x:hover{color:var(--text);background:var(--line)}
.ch.sel{border-color:var(--blue);background:var(--blue-bg)} .ch.sel .L{background:var(--blue);border-color:var(--blue);color:var(--on-primary)}
.ch.struck .T .tx{text-decoration:line-through;color:var(--dim)}
.ch.hasw{align-items:flex-start}
.ch.hasw .L{margin-top:1px}
.ch .wi{display:block;margin-top:5px;font-size:13.5px;line-height:1.45;color:var(--muted)}
.ch.right .wi{color:var(--text);opacity:.85}
.ch.done{cursor:default}
.ch.right{border-color:var(--green);background:var(--green-bg)} .ch.right .L{background:var(--green);border-color:var(--green);color:var(--on-green)}
.ch.wrong{border-color:var(--red);background:var(--red-bg)} .ch.wrong .L{background:var(--red);border-color:var(--red);color:#fff}
.ch .tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px}
.ch.right .tag{color:var(--green);background:var(--tag-ok)} .ch.wrong .tag{color:var(--red);background:var(--tag-bad)}
.nav{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.nbtn{border:1px solid var(--line2);background:transparent;border-radius:7px;padding:10px 22px;font-weight:600;font-size:15px}
.nbtn:hover:not(:disabled){background:var(--hover)}
.nbtn:disabled{opacity:.4;cursor:default}
.nbtn.primary{background:var(--blue-btn);border-color:var(--blue-btn);color:var(--on-primary)}
.nbtn.primary:hover:not(:disabled){filter:brightness(1.12);background:var(--blue-btn)}
.nbtn.okb{border-color:var(--green);color:var(--green)} .nbtn.badb{border-color:var(--red);color:var(--red)}
.timednote{margin-top:14px;color:var(--muted);font-size:13.5px}
.paused{text-align:center;padding:50px 20px}
.paused h3{margin:0 0 8px;font-size:22px}
.paused p{color:var(--muted);margin:0 0 20px}

.reveal-ans{margin-top:4px;padding:14px 16px;border-radius:7px;border:1px solid var(--green);background:var(--green-bg);font-size:17px;font-weight:700;color:var(--green)}

/* explanation */
.exp{margin-top:22px;border-top:1px solid var(--line);padding-top:20px}
.verdict{font-weight:700;font-size:16px;margin-bottom:6px}
.verdict.g{color:var(--green)} .verdict.r{color:var(--red)} .verdict.m{color:var(--muted)}
.exp h4{margin:18px 0 8px;font-size:12px;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase}
.exp p{margin:0;line-height:1.7;font-size:15.5px}
.exp p.pre{white-space:pre-line}
.badge{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:600;color:var(--badge-fg);border:1px solid var(--badge-line);background:var(--badge-bg);border-radius:10px;padding:1px 8px;vertical-align:1px}
.srcnote{margin-top:14px;color:var(--muted);font-size:13.5px;font-style:italic}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.why li{display:flex;gap:10px;line-height:1.55;font-size:15px;padding:9px 12px;border-radius:6px;background:var(--why-bg);border:1px solid var(--line)}
.why li .k{flex:none;font-weight:700;width:18px}
.why li.c{border-color:var(--green-line)} .why li.c .k{color:var(--green)}
.why li.n .k{color:var(--red)}
.why li .ct{color:var(--text);font-weight:600}
.why li .wt{color:var(--wt)}
.keynote{margin-top:16px;padding:10px 13px;border-left:3px solid var(--flag);background:var(--key-bg);color:var(--key-fg);font-size:14px;line-height:1.55;border-radius:0 6px 6px 0}
.eimgs{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.eimgs img{max-height:260px;max-width:100%;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:zoom-in}

/* notes box */
.notes{margin-top:22px}
.notes .nh{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.notes .nh b{letter-spacing:1.4px;font-size:12.5px}
.notes textarea{width:100%;min-height:110px;background:var(--choice);border:1px solid var(--line2);border-radius:7px;color:var(--text);padding:12px 14px;font:inherit;font-size:15px;resize:vertical}
.notes textarea:focus{outline:none;border-color:var(--blue)}

/* pages (builder, notes, search, report) */
.bcourses{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.bcx{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;line-height:1.35}
.bcx.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent)}
.bcx.off{opacity:.5;cursor:default}
.bcx input{margin-top:3px}
.bch{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.bch:first-of-type{margin-top:0}
.page{max-width:1100px}
.page h2{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.3px}
.page .sub{color:var(--muted);margin:0 0 22px;line-height:1.55}
.ptools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.box h3{margin:0 0 14px;font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.bsec{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.bsec>label{display:flex;align-items:center;gap:9px;font-weight:600;cursor:pointer}
.bsec .cnt{margin-left:auto;font-weight:500;color:var(--muted);font-size:13px}
.bsec details{margin-top:6px}
.bsec summary{cursor:pointer;color:var(--blue);font-size:13px;padding:3px 0}
.btopics{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 16px;padding:8px 2px 2px}
.btopics label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.btopics label .cnt{margin-left:auto;color:var(--muted);font-size:12.5px}
.btopics label.off{opacity:.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opts label{display:flex;gap:9px;align-items:center;cursor:pointer;font-size:14.5px}
.opts label .cnt{color:var(--muted);font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px}
.field input,.field select{background:var(--choice);border:1px solid var(--line2);border-radius:7px;color:var(--text);padding:8px 10px;font:inherit;font-size:14.5px;max-width:200px}
.bfoot{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:6px}
.bfoot .avail{color:var(--muted)}
.bfoot .avail b{color:var(--text)}
input[type=checkbox],input[type=radio]{accent-color:var(--blue);width:16px;height:16px}

.nsec{margin-bottom:26px}
.nsec>h3{margin:0 0 10px;font-size:18px}
.ntopic{margin:0 0 6px;color:var(--muted);font-size:12.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;padding-top:6px}
.nitem{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.nitem .nq{color:var(--muted);font-size:13.5px;line-height:1.5;margin-bottom:6px}
.nitem .nq b{color:var(--text)}
.nitem .nt{white-space:pre-wrap;line-height:1.6;font-size:15px}
.nitem .open{margin-top:8px;font-size:12.5px;padding:4px 10px}
.empty{color:var(--muted);padding:30px 0}

.sres{display:flex;flex-direction:column;gap:8px}
.hsearch,.psearch{position:relative;margin:0 0 18px}
.hsearch input,.psearch input{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:10px;color:var(--text);padding:12px 14px 12px 40px;font:inherit;font-size:15px}
.hsearch input:focus,.psearch input:focus{outline:none;border-color:var(--blue)}
.hsearch .ic,.psearch .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px;pointer-events:none}
.psearch{margin-bottom:10px}
.sscope,.sfilt{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip2{background:var(--card);border:1px solid var(--line2);color:var(--text);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip2.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--text)}
.chip2:disabled{opacity:.4;cursor:default}
.chip2 b{font-weight:700;margin-left:2px}
.cbadge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:4px;background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--text);margin-right:2px}
.sitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.sitem:hover{border-color:var(--blue-line)}
.sitem .sm{color:var(--muted);font-size:12.5px;font-weight:600;margin-bottom:4px}
.sitem .ss{line-height:1.55;font-size:14.5px}
.sitem mark,.nitem mark{background:var(--mark);color:#1a1300;border-radius:2px;padding:0 1px}
.sitem .where{color:var(--dim);font-size:12.5px;font-style:italic}
.sitem .st{float:right;font-size:12px;font-weight:700}
.sitem .st.ok{color:var(--green)} .sitem .st.bad{color:var(--red)}

.score{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.tile2{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;min-width:140px}
.tile2 .v{font-size:26px;font-weight:800;letter-spacing:-.3px}
.tile2 .l{color:var(--muted);font-size:12.5px;margin-top:2px}
.tile2.big .v{font-size:34px}
.tile2 .v.g{color:var(--green)} .tile2 .v.r{color:var(--red)}
table.rt{width:100%;border-collapse:collapse;font-size:14px}
table.rt th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.6px;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
table.rt td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.rt tr.click{cursor:pointer}
table.rt tr.click:hover td{background:var(--hover)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--green)}
.bar i.mid{background:var(--flag)} .bar i.low{background:var(--red)}
.res{font-weight:700}
.res.ok{color:var(--green)} .res.bad{color:var(--red)} .res.na{color:var(--muted)}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:50;cursor:zoom-out;padding:20px}
.lightbox.on{display:grid}
.lightbox img{max-width:96vw;max-height:92vh;border-radius:6px;background:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--toast);color:#fff;padding:9px 16px;border-radius:7px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
[hidden]{display:none!important}

/* course tabs */
.ctabs{display:flex;gap:4px;padding:0 12px 12px}
.ctab{flex:1;background:transparent;border:1px solid var(--line2);border-radius:8px;padding:8px 4px;font-size:14px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.ctab small{font-size:10.5px;font-weight:600;color:var(--dim)}
.ctab:hover{background:var(--hover);color:var(--text)}
.ctab.on{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.ctab.on small{color:var(--blue)}
.noq{color:var(--muted);font-size:13.5px;line-height:1.55;padding:6px 12px 12px}
.emptybox{background:var(--card);border:1px dashed var(--line2);border-radius:12px;padding:36px 28px;text-align:center;margin-top:6px}
.emptybox h3{margin:0 0 8px;font-size:19px}
.emptybox p{margin:0 auto;color:var(--muted);max-width:560px;line-height:1.6}

/* sidebar: home + collapsible sections */
.brand{cursor:pointer}
.chap.home{font-weight:600;margin-top:10px}
.more{background:none;border:none;color:var(--blue);font-size:12.5px;padding:4px 12px 8px;text-align:left}
.sec{border-radius:8px;margin-bottom:3px}
.sec-h{width:100%;display:flex;align-items:center;gap:9px;background:none;border:1px solid transparent;border-radius:7px;padding:10px 10px;text-align:left;font-size:15px;font-weight:700}
.sec-h:hover{background:var(--hover)}
.sec-h .chev{color:var(--muted);font-size:11px;transition:transform .15s;width:10px;flex:none}
.sec.open .sec-h .chev{transform:rotate(90deg)}
.sec-h .nm{flex:1}
.sec-h .n{color:var(--muted);font-size:12px;font-weight:500}
.sec.open{background:var(--choice);border:1px solid var(--line)}
.sec.open .sec-h{border-radius:7px 7px 0 0}
.sec-b{padding:2px 6px 8px}
.sec-b .rv{padding:2px 4px 8px}
.secbar{height:3px;border-radius:2px;background:var(--line);margin:0 10px 8px 29px;overflow:hidden}
.secbar i{display:block;height:100%;background:var(--green)}

/* menus */
.menu{position:relative;display:inline-block}
.pop{position:absolute;right:0;top:calc(100% + 6px);min-width:220px;background:var(--panel);border:1px solid var(--line2);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:6px;z-index:40}
.mi{display:flex;width:100%;align-items:center;gap:10px;background:none;border:none;border-radius:6px;padding:9px 11px;text-align:left;font-size:14px}
.mi:hover{background:var(--hover)}
.mi .ck{width:14px;color:var(--blue);font-weight:700;flex:none}
.mi.danger{color:var(--red)}
.mi-sep{height:1px;background:var(--line);margin:5px 4px}
.mi-h{font-size:11px;letter-spacing:1.2px;color:var(--muted);font-weight:700;padding:6px 11px 4px}

/* focus mode */
.app.focus{grid-template-columns:1fr}
.app.focus .side,.app.focus .rail,.app.focus #noteBox,.app.focus .mob{display:none!important}
.app.focus .main{padding:22px 24px 60px}
.app.focus #quizView{max-width:980px;margin:0 auto}
.app.focus .top h2{font-size:18px;color:var(--muted);font-weight:700}
.app.focus .stats{margin:10px 0 16px}

/* home */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.hero h2{margin:0}
.hero .sub{margin:4px 0 0}
.cont{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--blue-bg);border:1px solid var(--blue-line);border-radius:10px;padding:16px 20px;margin-bottom:16px}
.cont .l{color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase}
.cont .t{font-size:17px;font-weight:700;margin-top:3px}
.cont .t span{color:var(--muted);font-weight:500;font-size:14px}
.rvbig{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.rvbig button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left}
.rvbig button:hover{border-color:var(--blue-line)}
.rvbig .v{font-size:26px;font-weight:800}
.rvbig .l{color:var(--muted);font-size:13px}
.rvbig .v.r{color:var(--red)} .rvbig .v.f{color:var(--flag)}
.h3{margin:0 0 10px;font-size:13px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:700}
.secgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:24px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.scard h4{margin:0;font-size:16px}
.scard .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.scard .meta b{color:var(--text)}
.scard .pbar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.scard .pbar i{display:block;height:100%}
.scard .pbar .ok{background:var(--green)} .scard .pbar .bad{background:var(--red-tile)}
.scard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.scard .acts .btn{padding:5px 11px;font-size:13px}
.tlist{display:flex;flex-direction:column;gap:6px;margin-bottom:24px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;text-align:left;width:100%}
.trow:hover{border-color:var(--blue-line)}
.trow .n{color:var(--muted);font-size:13px}
@media (max-width:900px){ .rvbig{grid-template-columns:1fr 1fr 1fr;gap:8px} .rvbig .v{font-size:21px} }

@media (max-width:900px){
  .app,.app.norail{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;height:auto;min-height:100vh}
  .side{display:none;border-right:none;border-bottom:1px solid var(--line)}
  .side.open{display:flex}
  .chaps{max-height:60vh}
  .side-foot{display:none}
  .rail{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:10px 16px;border-right:none;border-bottom:1px solid var(--line);align-items:center}
  .rail-h{display:none}
  .main{padding:16px 16px 50px;overflow:visible}
  .mob{display:block}
  .top h2,.page h2{font-size:21px}
  .card,.box{padding:18px 16px}
  .stem{font-size:15.5px}
  .row2{grid-template-columns:1fr}
}
@media print{
  body{background:#fff;color:#000}
  .side,.rail,.mob,.noprint,.toast,.lightbox{display:none!important}
  .app{display:block;height:auto}
  .main{overflow:visible;padding:0}
  .nitem{border-color:#bbb;break-inside:avoid;background:#fff}
  .nitem .nq,.ntopic,.page .sub{color:#444}
  .nitem .nt,.nitem .nq b{color:#000}
}

<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand" id="brandHome" title="Home"><h1 id="brandTitle">MSK Summative</h1><p id="brandSub"></p></div>
    <div class="ctabs" id="ctabs"></div>
    <div class="stools">
      <div class="search" id="searchWrap">
        <svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input id="searchIn" type="search" placeholder="Search questions…" autocomplete="off">

</div>
<div class="lightbox" id="lightbox"><img alt=""></div>

<script src="anatomy.js?v=18"></script>

<script>
(function(){
// =====================================================================
// Data
// =====================================================================
// ---- Courses (summatives). To add one, add it here, then give its sections course:"<id>". ----
// Each section's prefix must be unique across the whole site (it's part of every saved question ID).
const COURSES = [
  {id:"fbs", name:"FBS", full:"Foundations of Basic Sciences"},
  {id:"msk", name:"MSK", full:"Musculoskeletal"},
  {id:"crs", name:"CRS", full:"Cardiovascular & Respiratory Systems"}
];
const SECTIONS = [
  {course:"msk", name:"Histology", all:"All Histology", prefix:"q", topics:window.TOPICS, qs:window.QUESTIONS,
   extra:[{name:"Review Slides Practice (new)", f:q=>q.src==="rev"}]},
  {course:"msk", name:"MSK Physiology", all:"All Physiology", prefix:"p", topics:window.PHYSIO_TOPICS, qs:window.PHYSIO_QUESTIONS,
   extra:[{name:"MSK Review 3 (skeletal)", f:q=>q.src==="rev3"}, {name:"MSK Review 4 (smooth)", f:q=>q.src==="rev4"}]},
  {course:"msk", name:"Biochemistry", all:"All Biochemistry", prefix:"b", topics:window.BCHM_TOPICS, qs:window.BCHM_QUESTIONS,
   extra:[{name:"From the Document", f:q=>q.src==="doc"}, {name:"Blueprint Practice (new)", f:q=>q.src==="new"}]},
  {course:"msk", name:"Anatomy (BRS)", all:"All Anatomy", prefix:"a", topics:window.ANAT_TOPICS, qs:window.ANAT_QUESTIONS,
   extra:[{name:"All Upper Limb", f:q=>q.limb==="Upper Limb"}, {name:"All Lower Limb", f:q=>q.limb==="Lower Limb"}]},
  {course:"msk", name:"MSK Embryology", all:"All Embryology", prefix:"e", topics:window.EMB_TOPICS, qs:window.EMB_QUESTIONS},
  {course:"fbs", name:"FBS Physiology", all:"All FBS Physiology", prefix:"fp", topics:window.FBS_PHYS_TOPICS, qs:window.FBS_PHYS_QUESTIONS,
   extra:[{name:"FBS Review 1", f:q=>q.src==="r1"}, {name:"Class Review Qs", f:q=>q.src==="cls"}, {name:"RMP & AP Questions", f:q=>q.src==="rmp"}]},
  {course:"fbs", name:"Anki Deck Practice Q's", all:"All Anki Deck Q's", prefix:"fa", topics:window.FBS_ANKI_TOPICS, qs:window.FBS_ANKI_QUESTIONS},
  {course:"crs", name:"CRS Embryology", all:"All CRS Embryology", prefix:"ce", topics:window.CRS_EMB_TOPICS, qs:window.CRS_EMB_QUESTIONS}
].filter(s=>s.qs && s.qs.length);

const Q = [], STATIC = [];
SECTIONS.forEach(sec=>{
  const co = sec.course;
  const qs = sec.qs.map((q,i)=>Object.assign({id:sec.prefix+(i+1), sec:sec.name, pfx:sec.prefix, num:i+1, course:co}, q));
  sec.items = qs; Q.push(...qs);
  STATIC.push({key:sec.prefix+":all", name:sec.all, sec:sec.name, pfx:sec.prefix, course:co, head:true, ids:qs.map(q=>q.id), kind:"static"});
  sec.topics.forEach(t=>{ const ids=qs.filter(q=>q.t===t).map(q=>q.id); if(ids.length) STATIC.push({key:sec.prefix+":t:"+t, name:t, sec:sec.name, pfx:sec.prefix, course:co, ids, kind:"static"}); });
  (sec.extra||[]).forEach(x=>{ const ids=qs.filter(x.f).map(q=>q.id); if(ids.length) STATIC.push({key:sec.prefix+":x:"+x.name, name:x.name, sec:sec.name, pfx:sec.prefix, course:co, ids, sub:true, kind:"static"}); });
});
const COURSE_BY_ID = Object.fromEntries(COURSES.map(c=>[c.id,c]));
COURSES.forEach(c=>{ c.sections = SECTIONS.filter(s=>s.course===c.id); c.items = Q.filter(q=>q.course===c.id); });
const STATIC_BY_KEY = Object.fromEntries(STATIC.map(c=>[c.key,c]));
const SEC_BY_PFX = Object.fromEntries(SECTIONS.map(s=>[s.prefix,s]));
const byId = Object.fromEntries(Q.map(q=>[q.id,q]));
const LET = "ABCDEFGH";

// =====================================================================
// Storage (+ migration from the first version)
// =====================================================================
const KEY = "msk-summative-v1";
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { S = {}; }
S.ans ??= {}; S.sel ??= {}; S.strike ??= {}; S.flag ??= {}; S.notes ??= {}; S.hl ??= {}; S.order ??= {};
S.scr ??= {}; S.pos ??= {}; S.snap ??= {}; S.tests ??= []; S.testSeq ??= 0;
if (S.v !== 2) {
  // chapter positions/scramble used to be stored by list number; move them to chapter keys
  const pos = {}, scr = {};
  Object.keys(S.pos).forEach(k=>{ const c = /^\d+$/.test(k) ? STATIC[+k] : null; if (c) pos[c.key] = S.pos[k]; else pos[k] = S.pos[k]; });
  Object.keys(S.scr).forEach(k=>{ const c = /^\d+$/.test(k) ? STATIC[+k] : null; if (c) scr[c.key] = S.scr[k]; else scr[k] = S.scr[k]; });
  S.pos = pos; S.scr = scr;
  S.cur = (typeof S.chap === "number" && STATIC[S.chap]) ? STATIC[S.chap].key : STATIC[0].key;
  delete S.chap; S.v = 2;
}
if (S.v === 2) {
  // single-course version → courses: everything so far belongs to MSK; "all sections" review lists become MSK's
  const fix = k => String(k).replace(/^all:rv:/, "msk:rv:");
  const move = o => Object.fromEntries(Object.entries(o||{}).map(([k,v])=>[fix(k),v]));
  S.pos = move(S.pos); S.scr = move(S.scr); S.snap = move(S.snap);
  if (S.cur) S.cur = fix(S.cur);
  S.tests.forEach(t=>{ t.course ??= "msk"; });
  S.course = "msk"; S.curBy = {msk: S.cur};
  S.v = 3;
}
S.course = COURSE_BY_ID[S.course] ? S.course : "msk"; S.curBy ??= {};
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast("Couldn't save — browser storage is full or blocked"); } }

let view = "home";          // home | quiz | builder | notes | search | report
let reportTest = null;
let mode = null;            // highlight tool: "hl" | null
// Highlighter colors. Your last-used color is remembered in this browser.
const HL_COLORS = [{k:"y",name:"Yellow"},{k:"g",name:"Green"},{k:"b",name:"Blue"},{k:"p",name:"Pink"},{k:"o",name:"Orange"}];
let hlColor = "y";
try { const c = localStorage.getItem("msk-hlcolor"); if (HL_COLORS.some(x=>x.k===c)) hlColor = c; } catch(e) {}
let paused = false;
let searchTerm = "";
let searchRet = null;
let searchScope = "course"; // "course" = current summative only, "all" = FBS + MSK + CRS
let searchFilter = "all";   // when scope is "all": which summative's results to show ("all" or a course id)       // where you were before searching: {view, key, pos, report}
let showAllTests = false;
let openMenu = null;        // "opts" | "text" | null
let focusOn = false;
const ZOOMS = [[0.92,"Small"],[1,"Default"],[1.12,"Large"],[1.25,"Extra large"],[1.4,"Huge"]];
let zoomV = 1; try { zoomV = +localStorage.getItem("msk-zoom") || 1; } catch(e){}

const $ = id => document.getElementById(id);
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),1800); }
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function plain(h){ return String(h??"").replace(/<img[^>]*>/g," ").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim(); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function fmtTime(s){ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0"); }

// =====================================================================
// Answer status (global record, or a test's own record)
// =====================================================================
function status(q, s){
  s = s || S; const a = s.ans[q.id];
  if (a === undefined) return null;
  if (q.type === "reveal") return a === "ok" ? "ok" : a === "bad" ? "bad" : null;
  return a === q.a ? "ok" : "bad";
}
function answered(q, s){ s = s || S; return q.type==="reveal" ? (s.ans[q.id]==="ok"||s.ans[q.id]==="bad") : s.ans[q.id]!==undefined; }

const REVIEW = [
  {k:"inc",  label:"Incorrect",  icon:"✗", f:q=>status(q,S)==="bad"},
  {k:"flag", label:"Flagged",    icon:"⚑", f:q=>!!S.flag[q.id]},
  {k:"un",   label:"Unanswered", icon:"○", f:q=>!answered(q,S)}
];
const REVIEW_BY_K = Object.fromEntries(REVIEW.map(r=>[r.k,r]));
function course(){ return COURSE_BY_ID[S.course]; }
function courseQ(){ return course().items; }
function courseSecs(){ return course().sections; }
function testCourses(t){ return t.courses && t.courses.length ? t.courses : [t.course||"msk"]; }
function isMixed(t){ return !!t && testCourses(t).length > 1; }
function courseTests(){ return S.tests.filter(t=>testCourses(t).includes(S.course)); }
// In a test that mixes summatives, label each question's section with its summative (e.g. "MSK · Histology").
function secLabel(q, t){
  const mixed = t && (t.kind==="search" ? S.searchCourse==="all" : isMixed(t.test || t));
  if (!mixed) return q.sec;
  const cn = COURSE_BY_ID[q.course] ? COURSE_BY_ID[q.course].name : "";
  return q.sec.startsWith(cn+" ") ? q.sec : cn+" · "+q.sec;
}
function scopeQs(scope){ return COURSE_BY_ID[scope] ? COURSE_BY_ID[scope].items : (SEC_BY_PFX[scope] ? SEC_BY_PFX[scope].items : []); }
function scopeName(scope){ return COURSE_BY_ID[scope] ? "All "+COURSE_BY_ID[scope].name : SEC_BY_PFX[scope].name; }

// =====================================================================
// Chapters: static, review (snapshot), search (snapshot), tests
// =====================================================================
function getChap(key){
  if (!key) return null;
  if (STATIC_BY_KEY[key]) return STATIC_BY_KEY[key];
  let m = key.match(/^(\w+):rv:(\w+)$/);
  if (m && REVIEW_BY_K[m[2]] && (COURSE_BY_ID[m[1]] || SEC_BY_PFX[m[1]])) {
    const r = REVIEW_BY_K[m[2]];
    const ids = (S.snap[key] || scopeQs(m[1]).filter(r.f).map(q=>q.id)).filter(id=>byId[id]);
    return {key, kind:"review", name:r.label+" only", sec:scopeName(m[1]), title:scopeName(m[1])+" · "+r.label+" only", ids};
  }
  if (key==="search") {
    const ids = (S.snap.search||[]).filter(id=>byId[id]);
    return {key, kind:"search", name:"Search", title:"Search · “"+(S.searchQ||"")+"”", ids};
  }
  m = key.match(/^test:(\d+)$/);
  if (m) {
    const t = S.tests.find(x=>String(x.id)===m[1]);
    if (t) { prepTest(t); return {key, kind:"test", name:t.name, title:t.name, ids:t.ids.filter(id=>byId[id]), test:t}; }
  }
  return null;
}
function prepTest(t){ t.ans ??= {}; t.sel ??= {}; t.strike ??= {}; t.order ??= {}; }
function chapCourse(c){
  if (!c) return null;
  if (c.course) return c.course;
  if (c.test) { const cs = testCourses(c.test); return cs.includes(S.course) ? S.course : cs[0]; }
  const m = c.key.match(/^(\w+):rv:/);
  if (m) return COURSE_BY_ID[m[1]] ? m[1] : (SEC_BY_PFX[m[1]] ? SEC_BY_PFX[m[1]].course : null);
  if (c.key==="search") return (S.searchCourse==="all" || !S.searchCourse) ? S.course : S.searchCourse;
  return null;
}
function firstChap(){ return STATIC.find(c=>c.course===S.course) || null; }
function chap(){ const c = getChap(S.cur); return (c && chapCourse(c)===S.course) ? c : firstChap(); }
function store(){ const c = chap(); return (c && c.test) || S; }
function timedActive(){ const c = chap(), t = c && c.test; return !!(t && t.mode==="timed" && !t.finished); }
function timedDone(){ const c = chap(), t = c && c.test; return !!(t && t.mode==="timed" && t.finished); }
function scrOn(){ const c = chap(); return !c ? false : c.test ? !!c.test.scr : !!S.scr[c.key]; }
function pos(){ const c = chap(); return !c ? 0 : Math.max(0, Math.min(S.pos[c.key] || 0, c.ids.length-1)); }
function curQ(){ const c = chap(); return c ? byId[c.ids[pos()]] : null; }
function hasProgress(q){
  const s = store(), id = q.id, st = s.strike[id];
  return s.ans[id]!==undefined || s.sel[id]!==undefined || !!(st && Object.values(st).some(Boolean));
}
function order(q, s, scr){
  s = s || store(); scr = scr===undefined ? scrOn() : scr;
  const n = q.c.length, base = [...Array(n).keys()];
  if (q.ns || !scr) return base;
  let o = s.order[q.id];
  if (!o || o.length !== n) { o = shuffle(base); s.order[q.id] = o; save(); }
  return o;
}
function secOf(key){ const m = String(key||"").match(/^(\w+):/); return m && SEC_BY_PFX[m[1]] ? m[1] : null; }
function inSearch(){ const c = getChap(S.cur); return view==="search" || (view==="quiz" && c && c.kind==="search"); }
function rememberSpot(){
  if (inSearch()) return;          // already searching — keep the original spot
  searchRet = {view, key:S.cur, pos: S.cur ? S.pos[S.cur] : undefined, report: reportTest};
}
function backLabel(){
  const r = searchRet;
  if (!r || r.view==="home") return "Home";
  if (r.view==="builder") return "Build a test";
  if (r.view==="notes") return "My notes";
  if (r.view==="report") { const t = S.tests.find(x=>x.id===r.report); return t ? t.name+" report" : "Score report"; }
  const c = getChap(r.key);
  if (!c) return "Home";
  const title = c.kind==="static" ? (c.head ? c.sec : c.name) : c.title;
  return title + " · Q" + (Math.min(r.pos||0, c.ids.length-1)+1);
}
function leaveSearch(){
  clearTimeout(searchT);
  $("searchIn").value = ""; $("searchWrap").classList.remove("has"); searchTerm = ""; searchScope = "course"; searchFilter = "all";
  const r = searchRet; searchRet = null;
  if (r && r.view==="quiz" && getChap(r.key)) {
    S.cur = r.key; S.curBy[S.course] = r.key; if (r.pos !== undefined) S.pos[r.key] = r.pos;
    view = "quiz";
  } else if (r && r.view==="report" && S.tests.find(x=>x.id===r.report)) { view = "report"; reportTest = r.report; }
  else if (r && ["builder","notes","home"].includes(r.view)) view = r.view;
  else view = "home";
  save(); renderAll(); $("main").scrollTo({top:0});
}
function openChapter(key, at){
  if (key !== "search") searchRet = null;
  S.cur = key; S.curBy[S.course] = key; if (at !== undefined) S.pos[key] = at;
  if (secOf(key)) S.openSec = secOf(key);
  view = "quiz"; paused = false; save();
  $("side").classList.remove("open"); renderAll();
  $("main").scrollTo({top:0}); window.scrollTo({top:0});
}
function openInSection(id){
  const q = byId[id]; if (!q) return;
  const key = q.pfx+":all"; openChapter(key, STATIC_BY_KEY[key].ids.indexOf(id));
}

function rvChips(scope){
  const qs = scopeQs(scope);
  return `<div class="rv">` + REVIEW.map(r=>{
    const n = qs.filter(r.f).length, key = scope+":rv:"+r.k;
    return `<button class="${S.cur===key&&view==="quiz"?"on":""} ${n?"":"zero"}" data-rv="${key}" title="${r.label} questions in ${esc(scopeName(scope))}">${r.icon} ${r.label} <b>${n}</b></button>`;
  }).join("") + `</div>`;
}
function testLabel(t){
  prepTest(t);
  const ids = t.ids.filter(id=>byId[id]);
  if (t.mode==="timed" && !t.finished) return "⏱ in progress";
  const done = ids.filter(id=>answered(byId[id], t)).length;
  const ok = ids.filter(id=>status(byId[id], t)==="ok").length;
  if (t.finished) return Math.round(ok*100/Math.max(1,ids.length))+"%";
  return done+"/"+ids.length;
}
function secStats(sec){
  const qs = sec.items, done = qs.filter(q=>answered(q,S)), ok = done.filter(q=>status(q,S)==="ok").length;
  return {n:qs.length, done:done.length, ok, bad:done.length-ok};
}
function chapBtn(c){
  return `<button class="chap ${S.cur===c.key&&view==="quiz"?"on":""} ${c.head?"all":""} ${c.sub?"sub":""}" data-key="${esc(c.key)}"><span>${esc(c.name)}</span><span class="n">${c.ids.length}</span></button>`;
}
function renderChaps(){
  let h = `<button class="chap home ${view==="home"?"on":""}" id="homeBtn"><span>⌂ Home</span></button>`;
  if (courseTests().length) {
    const list = courseTests().slice().reverse(), shown = showAllTests ? list : list.slice(0,3);
    h += `<div class="chap-h">MY TESTS</div>`;
    h += shown.map(t=>{
      const key = "test:"+t.id, on = S.cur===key && (view==="quiz" || (view==="report" && reportTest===t.id));
      return `<button class="chap sub ${on?"on":""}" data-key="${key}"><span>${esc(t.name)}</span><span class="n ${t.finished?"done":""}">${testLabel(t)}</span></button>`;
    }).join("");
    if (list.length > 3) h += `<button class="more" id="moreTests">${showAllTests ? "Show fewer" : "See all "+list.length+" tests"}</button>`;
  }
  h += `<div class="chap-h">${esc(course().name)} SECTIONS</div>`;
  if (!courseSecs().length) h += `<div class="noq">No questions added to ${esc(course().name)} yet.</div>`;
  courseSecs().forEach(sec=>{
    const open = S.openSec===sec.prefix, st = secStats(sec);
    h += `<div class="sec ${open?"open":""}"><button class="sec-h" data-sec="${sec.prefix}" aria-expanded="${open}"><span class="chev">▶</span><span class="nm">${esc(sec.name)}</span><span class="n">${st.done}/${st.n}</span></button>`;
    if (open) h += `<div class="secbar"><i style="width:${Math.round(st.done*100/st.n)}%"></i></div><div class="sec-b">` + rvChips(sec.prefix) + STATIC.filter(c=>c.pfx===sec.prefix).map(chapBtn).join("") + `</div>`;
    h += `</div>`;
  });
  $("chaps").innerHTML = h;
  $("ctabs").innerHTML = COURSES.map(c=>`<button class="ctab ${c.id===S.course?"on":""}" data-course="${c.id}" title="${esc(c.full)}">${esc(c.name)}<small>${c.items.length ? c.items.length+" Qs" : "empty"}</small></button>`).join("");
  $("brandTitle").textContent = course().name + " Summative";
  $("brandSub").textContent = (course().full !== course().name ? course().full + " · " : "") + (course().items.length ? course().items.length + " questions" : "no questions yet");
  document.title = course().name + " Summative";
  $("buildBtn").classList.toggle("on", view==="builder");
  $("notesBtn").classList.toggle("on", view==="notes");
}

function renderStats(){
  const c = chap(), s = store(), qs = c.ids.map(id=>byId[id]);
  $("ctitle").textContent = c.kind==="static" ? (c.head ? c.sec : c.sec+" · "+c.name) : c.title;
  if (!qs.length) { $("stats").innerHTML = `<b>0</b> questions`; return; }
  if (timedActive()) {
    const t = c.test, picked = qs.filter(q=>s.sel[q.id]!==undefined).length;
    $("stats").innerHTML = `<b>${picked}</b> / ${qs.length} answered · Timed block <span class="timer ${t.remaining<=60?"low":""}" id="timer">⏱ ${fmtTime(t.remaining)}</span>`;
    return;
  }
  const done = qs.filter(q=>answered(q,s)), ok = done.filter(q=>status(q,s)==="ok").length, bad = done.length-ok;
  const pct = done.length ? Math.round(ok*100/done.length) : 0;
  let note = "";
  if (c.kind==="review") note = `<span class="note">This list was made when you opened it — click the ${esc(c.name.replace(" only","").toLowerCase())} button again to refresh it.</span>`;
  if (c.kind==="test" && c.test.mode==="timed") note = `<span class="note">Block finished — review each question below, or open the score report.</span>`;
  if (c.kind==="test" && c.test.mode==="tutor") note = `<span class="note">Tutor-mode test · answers here also update your main progress.</span>`;
  $("stats").innerHTML = `<b>${done.length}</b> / ${qs.length} answered · <span class="g">${ok} correct</span> · <span class="r">${bad} incorrect</span> · ${pct}%${note}`;
}
function srcBadge(q){
  return (q.src==="new"?' <span class="badge">Blueprint practice</span>':"")+(q.src==="rev"?' <span class="badge">Review slides</span>':"")+
    (q.src==="rev3"?' <span class="badge">MSK Review 3</span>':"")+(q.src==="rev4"?' <span class="badge">MSK Review 4</span>':"");
}
function renderCard(){
  const c = chap();
  if (!c.ids.length) {
    $("card").innerHTML = `<div class="empty">No questions here right now.</div>`; $("noteBox").hidden = true; return;
  }
  $("noteBox").hidden = false;
  const q = curQ(), p = pos(), n = c.ids.length, s = store();
  const timed = timedActive(), tDone = timedDone();
  if (timed && paused) {
    $("card").innerHTML = `<div class="paused"><h3>Block paused</h3><p>The timer is stopped and the question is hidden.</p><button class="nbtn primary" id="pauseBtn2">▶ Resume</button></div>`;
    $("noteBox").hidden = true; return;
  }
  const isReveal = q.type === "reveal";
  const done = answered(q, s) || (tDone && !isReveal);
  const stemHTML = S.hl[q.id] || (q.html ? q.s : esc(q.s));
  let h = `<div class="qhead">
      <div class="qmeta">Question <b>${p+1}</b> of ${n} &nbsp;·&nbsp; ${esc(secLabel(q, chap()))} &nbsp;·&nbsp; ${esc(q.t)}${srcBadge(q)}</div>
      <div class="qtools">
        <span class="hlgroup"><button class="btn ${mode==="hl"?"on":""}" id="hlBtn" title="Select text to highlight it. Highlight an already-highlighted part to erase it. Click a highlight to remove it.">✎ Highlight</button><span class="sws">${HL_COLORS.map(c=>`<button class="sw hl-${c.k} ${hlColor===c.k?"on":""}" data-hlc="${c.k}" title="${c.name} highlighter" aria-label="${c.name} highlighter"></button>`).join("")}</span></span>
        <button class="btn ${S.flag[q.id]?"flagged":""}" id="flagBtn">⚑ ${S.flag[q.id]?"Flagged":"Flag"}</button>
        <button class="btn" id="resetQBtn" title="Clear your answer for this question only" ${hasProgress(q)&&!tDone?"":"disabled"}>↺ Reset question</button>
      </div></div>
    <div class="stem ${mode==="hl"?"hl-mode":""}" id="stem">${stemHTML}</div>`;
  if (q.img) h += `<img class="qimg zoom" src="${q.img}" alt="Image for question ${p+1}">`;

  if (!isReveal) {
    const o = order(q), sel = s.sel[q.id], ans = s.ans[q.id], st = s.strike[q.id] || {};
    h += `<div class="choices">` + o.map((oi,k)=>{
      let cls = "ch", tag = "";
      if (done && !timed) {
        cls += " done";
        if (oi === q.a) { cls += " right"; tag = `<span class="tag">Correct</span>`; }
        else if (oi === ans) { cls += " wrong"; tag = `<span class="tag">Your answer</span>`; }
      } else if (sel === oi) cls += " sel";
      if (st[oi]) cls += " struck";
      // After submitting, show each choice's own explanation right inside the choice.
      let why = "";
      if (done && !timed && q.w && q.w[oi]) {
        const wt = String(q.w[oi]).replace(/^\s*correct\s*(?:[.—–:-]\s*|$)/i, "").trim();
        if (wt) { why = `<span class="wi">${esc(wt.charAt(0).toUpperCase() + wt.slice(1))}</span>`; cls += " hasw"; }
      }
      return `<div class="${cls}" data-oi="${oi}"><span class="L">${LET[k]}</span><span class="T"><span class="tx">${esc(q.c[oi])}</span>${why}</span>${tag}<button class="x" data-strike="${oi}" title="Cross out">✕</button></div>`;
    }).join("") + `</div>`;
    if (timed) {
      h += `<div class="nav">
        <button class="nbtn" id="prevBtn" ${p===0?"disabled":""}>← Previous</button>
        ${p===n-1 ? `<button class="nbtn primary" id="endBtn2">End block</button>` : `<button class="nbtn primary" id="nextBtn">Next →</button>`}
      </div><div class="timednote">Timed block — answers are hidden until you end the block. You can change your answer any time before then.</div>`;
    } else {
      h += `<div class="nav">
        <button class="nbtn" id="prevBtn" ${p===0?"disabled":""}>← Previous</button>
        <button class="nbtn primary" id="submitBtn" ${done||sel===undefined?"disabled":""}>Submit</button>
        <button class="nbtn" id="nextBtn" ${p===n-1?"disabled":""}>Next →</button></div>`;
      if (done) h += explanation(q, o, s);
    }
  } else {
    const shown = s.ans[q.id] !== undefined;
    if (shown) h += `<div class="reveal-ans">${esc(q.ans)}</div>`;
    h += `<div class="nav">
      <button class="nbtn" id="prevBtn" ${p===0?"disabled":""}>← Previous</button>
      ${shown
        ? `<button class="nbtn okb" id="gotBtn">✓ I got it</button><button class="nbtn badb" id="missBtn">✕ I missed it</button>`
        : `<button class="nbtn primary" id="showBtn">Show answer</button>`}
      <button class="nbtn" id="nextBtn" ${p===n-1?"disabled":""}>Next →</button></div>`;
    if (shown) h += explanation(q, null, s);
  }
  $("card").innerHTML = h;
  fixImgs($("card"));
  $("note").value = S.notes[q.id] || "";
}

function explanation(q, o, s){
  s = s || store();
  let h = `<div class="exp">`;
  if (o) {
    const a = s.ans[q.id], letter = LET[o.indexOf(q.a)];
    if (a === undefined) h += `<div class="verdict m">Not answered. The answer is ${letter}. ${esc(q.c[q.a].trim())}</div>`;
    else { const right = a === q.a; h += `<div class="verdict ${right?"g":"r"}">${right?"Correct.":"Incorrect."} The answer is ${letter}. ${esc(q.c[q.a].trim())}</div>`; }
  } else {
    const m = s.ans[q.id];
    h += `<div class="verdict ${m==="bad"?"r":"g"}">Answer: ${esc(q.ans)}</div>`;
  }
  if (q.eh) h += `<h4>Explanation</h4><div class="eh">${q.eh}</div>`;
  if (q.ref) h += `<div class="srcnote">Source: ${esc(q.ref)}</div>`;
  if (q.se) h += `<h4>Explanation from the slides</h4><p class="pre">${esc(q.se)}</p>`;
  if (q.e) h += `<h4>${q.se ? "More detail" : "Why it's correct"}</h4><p class="pre">${esc(q.e)}</p>`;
  const imgs = (q.eimg||[]).concat((q.fig||[]).map(f=>`./${f}.jpg`));
  if (imgs.length) h += `<h4>${q.fig ? (q.pfx==="ce" ? "Figures from the guide" : "Figures from the slides") : "Figure"}</h4><div class="eimgs">${imgs.map(x=>`<img class="zoom" src="${x}" alt="" loading="lazy">`).join("")}</div>`;
  // (choice-by-choice notes now appear inside each answer choice, above)
  if (!o && q.w && q.w.length) {
    h += `<h4>How to tell it apart</h4><ul class="why">` + q.w.map(t=>`<li class="n"><span class="k">•</span><span class="wt">${esc(t)}</span></li>`).join("") + `</ul>`;
  }
  if (q.key) h += `<div class="keynote">${esc(q.key)}</div>`;
  if (q.src==="doc" && !q.given && !q.key) h += `<div class="srcnote">The document doesn't give an answer for this question; the answer here is supplied.</div>`;
  if (q.src==="new") h += `<div class="srcnote">Written for this site from the exam blueprint — not in the document.</div>`;
  if (q.src==="rev") h += `<div class="srcnote">Written for this site from your professor's histology review slides.</div>`;
  if (q.src==="rev3"||q.src==="rev4") h += `<div class="srcnote">From MSK Review ${q.src==="rev3"?3:4}. The document has no answer key, so the answer and explanation were supplied for this site.</div>`;
  return h + `</div>`;
}

// ---------- Test builder ----------

SECTIONS.forEach(s=>{ if (B.secs[s.prefix]===undefined) B.secs[s.prefix]=true; s.topics.forEach(t=>{ const k=s.prefix+"|"+t; if (B.tops[k]===undefined) B.tops[k]=true; }); });
const POOLS = [
  {k:"all",   label:"All questions",               f:()=>true},

  {k:"uninc", label:"Unanswered + incorrect",      f:q=>!answered(q,S)||status(q,S)==="bad"},

// Which summatives the builder draws from. Defaults to the one you're in; tick others to mix them.

function startTest(ids, opts){
  if (!ids.length) { toast("No questions match those settings"); return; }
  S.testSeq += 1;
  const courses = COURSES.map(c=>c.id).filter(id=>ids.some(x=>byId[x] && byId[x].course===id));
  const home = courses.includes(S.course) ? S.course : courses[0];
  if (home !== S.course) { S.curBy[S.course] = S.cur; S.course = home; }
  const label = courses.map(id=>COURSE_BY_ID[id].name).join(" + ");
  const t = {id: Date.now(), course: home, courses, name: `${label} Test ${S.testSeq} · ${ids.length} Qs${opts.mode==="timed"?" · timed":""}`, ids, mode: opts.mode,
    per: opts.per, remaining: opts.mode==="timed" ? ids.length*opts.per : null, scr: opts.scr, created: Date.now(), finished: false,
    ans:{}, sel:{}, strike:{}, order:{}};
  S.tests.push(t);
  while (S.tests.length > 60) { const old = S.tests.shift(); delete S.pos["test:"+old.id]; }
  openChapter("test:"+t.id, 0);
  toast(opts.mode==="timed" ? "Timed block started — good luck" : "Test started");
}

// ---------- Score report ----------
function renderReport(t){
  prepTest(t);
  const ids = t.ids.filter(id=>byId[id]), qs = ids.map(id=>byId[id]);
  const ok = qs.filter(q=>status(q,t)==="ok").length;
  const bad = qs.filter(q=>status(q,t)==="bad").length;
  const na = qs.length - ok - bad;
  const pct = Math.round(ok*100/Math.max(1,qs.length));
  const used = t.mode==="timed" ? (ids.length*t.per - (t.remaining||0)) : null;
  const groups = {};
  qs.forEach(q=>{ const g = secLabel(q,t)+" · "+q.t; (groups[g] ??= {ok:0,n:0}); groups[g].n++; if (status(q,t)==="ok") groups[g].ok++; });
  const rows = Object.entries(groups).map(([g,v])=>({g, ...v, p: Math.round(v.ok*100/v.n)})).sort((a,b)=>a.p-b.p || b.n-a.n);
  let h = `<div class="page"><h2>${esc(t.name)}</h2>
    <p class="sub">${t.mode==="timed" ? (t.finished ? "Timed block · finished" : "Timed block · in progress") : "Tutor mode"} · created ${new Date(t.created).toLocaleString()}</p>
    <div class="ptools noprint">
      <button class="btn primary" data-treview="0">Review questions</button>
      ${(bad+na) ? `<button class="btn" id="retakeBtn">↻ New test from the ${bad+na} missed</button>` : ""}
      <button class="btn danger" id="delTestBtn">Delete test</button>
    </div>
    <div class="score">
      <div class="tile2 big"><div class="v">${pct}%</div><div class="l">score</div></div>
      <div class="tile2"><div class="v g">${ok}</div><div class="l">correct</div></div>
      <div class="tile2"><div class="v r">${bad}</div><div class="l">incorrect</div></div>
      <div class="tile2"><div class="v">${na}</div><div class="l">${t.mode==="timed"?"not answered":"not yet answered"}</div></div>
      ${used!==null ? `<div class="tile2"><div class="v">${fmtTime(used)}</div><div class="l">time used · ${fmtTime(used/Math.max(1,qs.length))} per question</div></div>` : ""}
    </div>
    ${isMixed(t) ? `<div class="box"><h3>By summative</h3><table class="rt"><thead><tr><th>Summative</th><th>Correct</th><th style="width:40%"></th></tr></thead><tbody>` +
      testCourses(t).map(cid=>{ const cq = qs.filter(q=>q.course===cid); if (!cq.length) return "";
        const c = cq.filter(q=>status(q,t)==="ok").length, p = Math.round(c*100/cq.length);
        return `<tr><td>${esc(COURSE_BY_ID[cid].name)} <span class="muted">· ${esc(COURSE_BY_ID[cid].full)}</span></td><td>${c}/${cq.length} · ${p}%</td><td><div class="bar"><i class="${p<50?"low":p<75?"mid":""}" style="width:${p}%"></i></div></td></tr>`; }).join("") +
      `</tbody></table></div>` : ""}
    <div class="box"><h3>By topic <span class="muted" style="font-weight:500">— weakest first</span></h3>
      <table class="rt"><thead><tr><th>Section · topic</th><th>Correct</th><th style="width:40%"></th></tr></thead><tbody>` +
      rows.map(r=>`<tr><td>${esc(r.g)}</td><td>${r.ok}/${r.n} · ${r.p}%</td><td><div class="bar"><i class="${r.p<50?"low":r.p<75?"mid":""}" style="width:${r.p}%"></i></div></td></tr>`).join("") +
      `</tbody></table></div>
    <div class="box"><h3>Questions <span class="muted" style="font-weight:500">— click one to review it</span></h3>
      <table class="rt"><thead><tr><th>#</th><th>Section · topic</th><th>Yours</th><th>Answer</th><th>Result</th></tr></thead><tbody>` +
      qs.map((q,i)=>{
        const o = order(q, t, !!t.scr), a = t.ans[q.id], r = status(q,t);
        return `<tr class="click" data-treview="${i}"><td>${i+1}${S.flag[q.id]?' <span style="color:var(--flag)">⚑</span>':""}</td><td>${esc(secLabel(q,t))} · ${esc(q.t)}</td>
          <td>${a===undefined?"—":LET[o.indexOf(a)]}</td><td>${LET[o.indexOf(q.a)]}</td>
          <td class="res ${r==="ok"?"ok":r==="bad"?"bad":"na"}">${r==="ok"?"✓ Correct":r==="bad"?"✗ Incorrect":"— Not answered"}</td></tr>`;
      }).join("") + `</tbody></table></div></div>`;
  showPage(h);
}
function finishTest(t, reason){
  prepTest(t);
  t.ids.forEach(id=>{ if (t.sel[id]!==undefined) { t.ans[id] = t.sel[id]; S.ans[id] = t.sel[id]; } });
  t.finished = true; t.remaining = Math.max(0, t.remaining||0); paused = false; save();
  view = "report"; reportTest = t.id; renderAll();
  toast(reason==="time" ? "Time's up — block ended" : "Block ended");
}

function downloadNotes(){
  let out = course().name + " Summative — my notes\n" + new Date().toLocaleString() + "\n";
  courseSecs().forEach(s=>{
    const mine = s.items.filter(q=>S.notes[q.id] && S.notes[q.id].trim());
    if (!mine.length) return;
    out += "\n\n==================== " + s.name.toUpperCase() + " ====================\n";
    [...new Set(mine.map(q=>q.t))].forEach(t=>{
      out += "\n--- " + t + " ---\n";

    });
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], {type:"text/plain"}));
  a.download = course().name + "-Summative-notes.txt"; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

// ---------- Search ----------
const SEARCH_IDX = Q.map(q=>({q, fields:[
  ["question", plain(q.s)], ["choices", (q.c||[]).join(" · ")], ["answer", q.ans||""],
  ["explanation", [plain(q.eh), q.se, q.e].filter(Boolean).join(" ")]
]}));
function searchQs(term, scope){
  const t = term.toLowerCase(), res = [];
  SEARCH_IDX.forEach(x=>{
    if ((scope||searchScope)!=="all" && x.q.course !== S.course) return;
    for (const [where, txt] of x.fields) {
      const i = txt.toLowerCase().indexOf(t);
      if (i >= 0) { res.push({q:x.q, where, txt, i}); break; }
    }
  });
  return res;
}
function snippet(txt, i, len){
  const a = Math.max(0, i-80), b = Math.min(txt.length, i+len+120);
  const pre = (a>0?"…":"") + txt.slice(a, i), hit = txt.slice(i, i+len), post = txt.slice(i+len, b) + (b<txt.length?"…":"");
  return esc(pre) + "<mark>" + esc(hit) + "</mark>" + esc(post);
}
function searchResultsHTML(term){
  const all = searchScope==="all";
  const raw = term.length>=2 ? searchQs(term) : [];
  if (all && searchFilter!=="all" && !raw.some(r=>r.q.course===searchFilter)) searchFilter = "all";
  const res = all && searchFilter!=="all" ? raw.filter(r=>r.q.course===searchFilter) : raw;
  S._lastSearch = res.map(r=>r.q.id);
  if (term.length < 2) return `<p class="sub">Type at least 2 letters to search${all?" every FBS, MSK and CRS question":" "+esc(course().name)}.</p>`;
  const where = all ? (searchFilter==="all" ? "across FBS, MSK and CRS" : "in "+COURSE_BY_ID[searchFilter].name) : "in "+esc(course().name);
  let h = `<p class="sub"><b>${res.length}</b> question${res.length===1?"":"s"} ${where} mention “${esc(term)}”${res.length?" — click one to open it, or study them all as a set.":"."}</p>`;
  if (all) {
    const cnt = id => raw.filter(r=>r.q.course===id).length;
    h += `<div class="sfilt"><button class="chip2 ${searchFilter==="all"?"on":""}" data-sfilt="all">All <b>${raw.length}</b></button>` +
      COURSES.map(c=>`<button class="chip2 ${searchFilter===c.id?"on":""}" data-sfilt="${c.id}" ${cnt(c.id)?"":"disabled"}>${esc(c.name)} <b>${cnt(c.id)}</b></button>`).join("") + `</div>`;
  }
  if (res.length) h += `<div class="ptools"><button class="btn primary" data-sopen="0">Study these ${res.length} questions →</button></div>`;
  h += `<div class="sres">` + res.slice(0,300).map((r,i)=>{
    const stt = status(r.q,S), cn = COURSE_BY_ID[r.q.course].name;
    return `<button class="sitem" data-sopen="${i}"><div class="sm">${all?`<span class="cbadge">${esc(cn)}</span> `:""}${esc(r.q.sec)} · ${esc(r.q.t)} · Q${r.q.num}
      ${stt?`<span class="st ${stt}">${stt==="ok"?"✓ correct":"✗ incorrect"}</span>`:""}</div>
      <div class="ss">${snippet(r.txt, r.i, term.length)}</div>${r.where!=="question"?`<div class="where">found in the ${r.where}</div>`:""}</button>`;
  }).join("") + `</div>` + (res.length>300?`<p class="muted">Showing the first 300 results.</p>`:"");
  return h;
}

function go(i){
  const n = chap().ids.length; if (i<0||i>=n) return;
  S.pos[chap().key] = i; save(); renderRail(); renderCard();
  $("main").scrollTo({top:0, behavior:"smooth"}); window.scrollTo({top:0});
}
function pick(oi){
  const q = curQ(), s = store(); if (!q || q.type==="reveal") return;
  if (timedActive()) { if (paused) return; s.sel[q.id] = oi; save(); renderRail(); renderStats(); renderCard(); return; }
  if (answered(q,s) || timedDone()) return;
  s.sel[q.id] = oi; save(); renderCard();
}
function submit(){
  const q = curQ(), s = store();
  if (!q || q.type==="reveal" || timedActive() || timedDone() || answered(q,s) || s.sel[q.id]===undefined) return;
  s.ans[q.id] = s.sel[q.id];
  if (s !== S) S.ans[q.id] = s.sel[q.id];
  save(); renderChaps(); renderRail(); renderStats(); renderCard();
}
// FBS and CRS images live in their own files and only download the first time one of their figures is shown.
const LAZY_IMGS = [{re:/^fp-/, file:"images-fbs.js"}, {re:/^ce-/, file:"images-crs.js"}];
const lazyState = {}; // file -> 1 loading, 2 done
function loadLazyImgs(file){
  if (lazyState[file]) return; lazyState[file] = 1;
  const sc = document.createElement("script"); sc.src = file+"?v=18";
  sc.onload = ()=>{ lazyState[file] = 2; fixImgs(document); };
  sc.onerror = ()=>{ delete lazyState[file]; };
  document.head.appendChild(sc);
}
function fixImgs(root){
  root.querySelectorAll("img").forEach(i=>{
    const k=(i.dataset.k||i.getAttribute("src")||"").replace(/^\.\//,"");
    if (window.IMG && IMG[k]) { i.dataset.k=k; i.src=IMG[k]; }
    else { const L = LAZY_IMGS.find(x=>x.re.test(k)); if (L) { i.dataset.k=k; loadLazyImgs(L.file); } }
  });
}
function saveStem(){
  const q = curQ(), el = $("stem"); if (!el) return;
  const c = el.cloneNode(true); c.querySelectorAll("img[data-k]").forEach(i=>i.setAttribute("src", i.dataset.k));
  if (el.querySelector("mark")) S.hl[q.id] = c.innerHTML; else delete S.hl[q.id];
  save();
}
// Pull a node out of any highlight it sits inside, splitting that highlight around it.
function liftOutOfMarks(node, root){
  let p = node.parentElement;
  while (p && p !== root && root.contains(p)) {
    if (p.tagName === "MARK") {
      const before = p.cloneNode(false), after = p.cloneNode(false);
      while (p.firstChild && p.firstChild !== node) before.appendChild(p.firstChild);
      p.removeChild(node);
      while (p.firstChild) after.appendChild(p.firstChild);
      if (before.textContent) p.parentNode.insertBefore(before, p);
      p.parentNode.insertBefore(node, p);
      if (after.textContent) p.parentNode.insertBefore(after, p);
      p.remove();
    }
    p = node.parentElement;
  }
}
function highlightSelection(){
  const el = $("stem"), sel = window.getSelection();
  if (!el || !sel.rangeCount || sel.isCollapsed) return false;
  const r = sel.getRangeAt(0);
  if (!el.contains(r.commonAncestorContainer)) return false;
  // If everything selected is already highlighted, this acts as the eraser.
  const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let anyText = false, allMarked = true;
  for (let n = tw.nextNode(); n; n = tw.nextNode()) {
    if (!r.intersectsNode(n) || !n.textContent.trim()) continue;
    anyText = true;
    const mk = n.parentElement.closest("mark");
    if (!mk || !el.contains(mk)) { allMarked = false; break; }
  }
  if (!anyText) { sel.removeAllRanges(); return false; }
  const m = document.createElement("mark");
  m.appendChild(r.extractContents());
  r.insertNode(m);
  m.querySelectorAll("mark").forEach(x=>x.replaceWith(...x.childNodes));
  liftOutOfMarks(m, el);
  if (allMarked) m.replaceWith(...m.childNodes);          // erase
  else m.className = "hl-" + hlColor;                       // highlight in the chosen color
  el.querySelectorAll("mark").forEach(x=>{ if (!x.textContent) x.remove(); });
  sel.removeAllRanges(); el.normalize(); saveStem(); return true;
}
function endBlock(){
  const t = chap().test; if (!t || t.finished) return;
  const left = t.ids.filter(id=>t.sel[id]===undefined).length;
  if (!confirm("End this block now?" + (left ? `\n\n${left} question${left===1?" is":"s are"} unanswered and will be marked as not answered.` : ""))) return;
  finishTest(t, "user");
}
function setTheme(th){
  if (th==="light") document.documentElement.setAttribute("data-theme","light"); else document.documentElement.removeAttribute("data-theme");
  try { localStorage.setItem("msk-theme", th); } catch(e){}
  themeLabel();
}
function themeLabel(){ $("themeBtn").textContent = document.documentElement.getAttribute("data-theme")==="light" ? "Dark" : "Light"; }

function goKey(key){
  const c = getChap(key); if (!c) return;
  if (c.test && c.test.finished && c.test.mode==="timed") { S.cur = key; view = "report"; reportTest = c.test.id; save(); $("side").classList.remove("open"); renderAll(); return; }
  openChapter(key);
}
function switchCourse(id){
  if (!COURSE_BY_ID[id] || id===S.course) { view = "home"; renderAll(); return; }
  S.curBy[S.course] = S.cur;
  S.course = id;
  S.cur = S.curBy[id] || (firstChap() ? firstChap().key : null);
  S.openSec = secOf(S.cur) || (courseSecs()[0] ? courseSecs()[0].prefix : null);
  view = "home"; focusOn = false; paused = false; showAllTests = false; openMenu = null;
  clearTimeout(searchT); $("searchIn").value = ""; $("searchWrap").classList.remove("has"); searchTerm = ""; searchRet = null;
  save(); $("side").classList.remove("open"); renderAll(); $("main").scrollTo({top:0});
  toast(COURSE_BY_ID[id].name + (COURSE_BY_ID[id].items.length ? "" : " — no questions yet"));
}
function setFocus(on){ focusOn = on; openMenu = null; renderAll(); if (on) toast("Focus mode — press Esc to exit"); }
document.addEventListener("click", e=>{
  const t = e.target;
  // menus
  const mb = t.closest("[data-menu]");
  if (mb) { openMenu = openMenu===mb.dataset.menu ? null : mb.dataset.menu; renderTools(); return; }
  if (openMenu && !t.closest(".pop")) { openMenu = null; renderTools(); }
  if (t.closest(".pop .mi")) openMenu = null;
  const zb = t.closest("[data-zoom]");
  if (zb) { zoomV = +zb.dataset.zoom; try { localStorage.setItem("msk-zoom", zoomV); } catch(e){} renderAll(); toast("Text size: "+ZOOMS.find(z=>Math.abs(z[0]-zoomV)<.001)[1]); return; }
  if (t.closest("#focusBtn")) { setFocus(!focusOn); return; }
  const cb = t.closest("[data-course]");
  if (cb) { switchCourse(cb.dataset.course); return; }
  // home / sidebar
  if (t.closest("#homeBtn") || t.closest("#brandHome")) { view = "home"; focusOn = false; $("side").classList.remove("open"); renderAll(); $("main").scrollTo({top:0}); return; }
  const sh = t.closest("[data-sec]");
  if (sh) { S.openSec = S.openSec===sh.dataset.sec ? null : sh.dataset.sec; save(); renderChaps(); return; }
  const os = t.closest("[data-opensec]");
  if (os) { S.openSec = os.dataset.opensec; save(); renderChaps(); $("side").classList.add("open"); const el = document.querySelector(".sec.open"); if (el) el.scrollIntoView({block:"start", behavior:"smooth"}); return; }
  if (t.closest("#moreTests")) { showAllTests = !showAllTests; renderChaps(); return; }
  const gk = t.closest("[data-go]"); if (gk) { goKey(gk.dataset.go); return; }
  const act = t.closest("[data-act]");
  if (act) { view = act.dataset.act==="build" ? "builder" : "notes"; renderAll(); $("main").scrollTo({top:0}); return; }
  // sidebar
  const rv = t.closest("[data-rv]");
  if (rv) {
    const key = rv.dataset.rv, m = key.match(/^(\w+):rv:(\w+)$/);
    const ids = scopeQs(m[1]).filter(REVIEW_BY_K[m[2]].f).map(q=>q.id);
    if (!ids.length) { toast("No "+REVIEW_BY_K[m[2]].label.toLowerCase()+" questions in "+scopeName(m[1])+" right now"); return; }
    S.snap[key] = ids; openChapter(key, 0); return;
  }
  const chapB = t.closest(".chap[data-key]");
  if (chapB) { goKey(chapB.dataset.key); return; }
  if (t.closest("#buildBtn")) { view = "builder"; $("side").classList.remove("open"); renderAll(); return; }
  if (t.closest("#notesBtn")) { view = "notes"; $("side").classList.remove("open"); renderAll(); return; }
  if (t.closest("#themeBtn")) { setTheme(document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light"); return; }
  if (t.closest("#searchClr") || t.closest("#searchBack")) {
    if (inSearch()) leaveSearch();
    else { clearTimeout(searchT); $("searchIn").value = ""; $("searchWrap").classList.remove("has"); searchTerm = ""; }
    return;
  }
  if (t.closest("#menuBtn")) { $("side").classList.toggle("open"); return; }

  // pages
  const sopen = t.closest("[data-sopen]");
  const ssc = t.closest("[data-sscope]");
  if (ssc) { searchScope = ssc.dataset.sscope; searchFilter = "all"; renderSearch(); return; }
  const sft = t.closest("[data-sfilt]");
  if (sft && !sft.disabled) { searchFilter = sft.dataset.sfilt; renderSearch(); return; }
  if (sopen) { S.snap.search = S._lastSearch || []; S.searchQ = searchTerm.trim(); S.searchCourse = searchScope==="all" ? "all" : S.course; openChapter("search", +sopen.dataset.sopen); return; }
  const oq = t.closest("[data-openq]"); if (oq) { openInSection(oq.dataset.openq); return; }
  if (t.closest("#printNotesBtn")) { window.print(); return; }
  if (t.closest("#dlNotesBtn")) { downloadNotes(); return; }
  const tr = t.closest("[data-treview]");
  if (tr) { const tt = S.tests.find(x=>x.id===reportTest); if (tt) openChapter("test:"+tt.id, +tr.dataset.treview); return; }
  if (t.closest("#retakeBtn")) {
    const tt = S.tests.find(x=>x.id===reportTest); if (!tt) return;
    const ids = tt.ids.filter(id=>byId[id] && status(byId[id], tt)!=="ok");
    startTest(shuffle(ids), {mode:tt.mode, per:tt.per||90, scr:tt.scr}); return;
  }
  if (t.closest("#delTestBtn")) {
    const tt = S.tests.find(x=>x.id===reportTest); if (!tt) return;
    if (!confirm("Delete “"+tt.name+"”? Your main progress isn't affected.")) return;
    S.tests = S.tests.filter(x=>x!==tt); delete S.pos["test:"+tt.id];
    if (S.cur==="test:"+tt.id) S.cur = firstChap() ? firstChap().key : null;
    view = "quiz"; save(); renderAll(); toast("Test deleted"); return;
  }
  const bAll = t.closest("[data-ball]"), bNone = t.closest("[data-bnone]");
  if (bAll || bNone) { const p = (bAll||bNone).dataset[bAll?"ball":"bnone"]; SEC_BY_PFX[p].topics.forEach(x=>B.tops[p+"|"+x]=!!bAll); saveBuilder(); renderBuilder(); return; }
  if (t.closest("#bStart")) {
    const pool = shuffle(builderPool().map(q=>q.id));
    const n = Math.max(1, Math.min(+$("bN").value || B.n, pool.length));
    B.n = n; saveBuilder();
    startTest(pool.slice(0, n), {mode:B.mode, per:+B.per, scr:B.scr}); return;
  }

  // quiz
  if (view !== "quiz") return;
  const tile = t.closest(".tile"); if (tile) { go(+tile.dataset.i); return; }
  const strike = t.closest("[data-strike]");
  if (strike) { e.stopPropagation(); if (timedDone()) return; const s=store(), q=curQ(), oi=+strike.dataset.strike; (s.strike[q.id] ??= {}); s.strike[q.id][oi] = !s.strike[q.id][oi]; save(); renderCard(); return; }
  const ch = t.closest(".ch"); if (ch) { pick(+ch.dataset.oi); return; }
  const z = t.closest(".zoom"); if (z) { $("lightbox").querySelector("img").src = z.src; $("lightbox").classList.add("on"); return; }
  if (t.closest("#prevBtn")) return go(pos()-1);
  if (t.closest("#nextBtn")) return go(pos()+1);
  if (t.closest("#submitBtn")) return submit();
  if (t.closest("#endBtn") || t.closest("#endBtn2")) return endBlock();
  if (t.closest("#pauseBtn") || t.closest("#pauseBtn2")) { paused = !paused; renderTools(); renderCard(); toast(paused?"Paused":"Resumed"); return; }
  if (t.closest("#reportBtn")) { view = "report"; reportTest = chap().test.id; renderAll(); return; }
  if (t.closest("#showBtn")) { store().ans[curQ().id] = "shown"; save(); renderCard(); return; }
  if (t.closest("#gotBtn") || t.closest("#missBtn")) {
    const v = t.closest("#gotBtn") ? "ok" : "bad", s = store(), id = curQ().id;
    s.ans[id] = v; if (s !== S) S.ans[id] = v;
    save(); renderChaps(); renderRail(); renderStats(); renderCard(); return;
  }
  if (t.closest("#flagBtn")) { const id=curQ().id; S.flag[id]=!S.flag[id]; if(!S.flag[id]) delete S.flag[id]; save(); renderChaps(); renderRail(); renderCard(); return; }
  if (t.closest("#hlBtn")) { if (highlightSelection()) { renderCard(); return; } mode = mode==="hl"?null:"hl"; renderCard(); return; }
  const swb = t.closest("[data-hlc]");
  if (swb) {
    hlColor = swb.dataset.hlc; try { localStorage.setItem("msk-hlcolor", hlColor); } catch(e) {}
    mode = "hl"; highlightSelection(); renderCard(); return;
  }
  if (t.closest("#scrambleBtn")) {
    const key = chap().key; S.scr[key] = !S.scr[key];
    if (S.scr[key]) chap().ids.forEach(id=>delete S.order[id]);
    save(); renderTools(); renderCard(); toast(S.scr[key] ? "Choices scrambled" : "Original choice order"); return;
  }
  if (t.closest("#clearHlBtn")) { chap().ids.forEach(id=>delete S.hl[id]); save(); renderCard(); toast("Highlights cleared for this chapter"); return; }
  if (t.closest("#resetQBtn")) {
    const q = curQ(), s = store(); if (!hasProgress(q) || timedDone()) return;
    delete s.ans[q.id]; delete s.sel[q.id]; delete s.strike[q.id]; delete s.order[q.id];
    save(); renderChaps(); renderRail(); renderStats(); renderCard(); toast("Question reset"); return;
  }
  if (t.closest("#resetBtn")) {
    const c = chap();
    if (!confirm("Reset all answers in “"+(c.title||c.name)+"”? Highlights, flags and notes are kept.")) return;
    c.ids.forEach(id=>{ delete S.ans[id]; delete S.sel[id]; delete S.strike[id]; delete S.order[id]; });
    S.pos[c.key] = 0; save(); renderAll(); toast("Chapter reset"); return;
  }
});
document.addEventListener("click", e=>{ if (e.target.closest("#lightbox")) $("lightbox").classList.remove("on"); }, true);

// builder form changes
document.addEventListener("change", e=>{
  if (view !== "builder") return;
  const t = e.target;
  if (t.dataset.bcx) { bCourses(); B.cx[t.dataset.bcx] = t.checked; }
  else if (t.dataset.bsec) B.secs[t.dataset.bsec] = t.checked;
  else if (t.dataset.btop) B.tops[t.dataset.btop] = t.checked;
  else if (t.name==="bpool") B.pool = t.value;
  else if (t.name==="bmode") B.mode = t.value;
  else if (t.id==="bPer") B.per = +t.value;
  else if (t.id==="bScr") B.scr = t.checked;
  else if (t.id==="bN") { B.n = Math.max(1, +t.value||1); saveBuilder(); return; }
  else return;
  saveBuilder(); renderBuilder();
});
document.addEventListener("toggle", e=>{ const d = e.target; if (d.dataset && d.dataset.bopen) { B.open[d.dataset.bopen] = d.open; saveBuilder(); } }, true);

// search box
let searchT = 0;
document.addEventListener("input", e=>{
  const id = e.target.id;
  if (id!=="homeSearchIn" && id!=="pageSearchIn") return;
  const v = e.target.value;
  clearTimeout(searchT);
  searchT = setTimeout(()=>{
    if (id==="homeSearchIn") { if (v.trim().length >= 2) startGlobalSearch(v); return; }
    searchTerm = v; renderSearch();
  }, 180);
});
document.addEventListener("keydown", e=>{
  if (e.key==="Escape" && (e.target.id==="pageSearchIn" || e.target.id==="homeSearchIn")) { e.target.blur(); if (inSearch()) leaveSearch(); else e.target.value=""; }
});
$("searchIn").addEventListener("input", e=>{
  const v = e.target.value; $("searchWrap").classList.toggle("has", !!v);
  clearTimeout(searchT);
  searchT = setTimeout(()=>{
    searchTerm = v;
    if (v.trim().length >= 2) { if (!inSearch()) searchScope = "course"; rememberSpot(); view = "search"; $("pageSearchIn") && ($("pageSearchIn").value = v); renderAll(); $("searchIn").focus(); }
    else if (!v.trim() && view==="search") leaveSearch();
  }, 220);
});
$("searchIn").addEventListener("keydown", e=>{ if (e.key==="Escape") { $("searchClr").click(); e.target.blur(); } });

document.addEventListener("mouseup", e=>{
  if (!(view==="quiz" && mode==="hl" && e.target.closest && e.target.closest("#stem"))) return;
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) { highlightSelection(); return; }
  const mk = e.target.closest("#stem mark");
  if (mk) { mk.replaceWith(...mk.childNodes); $("stem").normalize(); saveStem(); }
});
$("note").addEventListener("input", e=>{
  const id = curQ().id; if (e.target.value.trim()) S.notes[id]=e.target.value; else delete S.notes[id]; save();
});
document.addEventListener("keydown", e=>{
  if (e.target.matches("textarea,input,select")) return;
  if (e.key==="Escape") {
    if ($("lightbox").classList.contains("on")) { $("lightbox").classList.remove("on"); return; }
    if (openMenu) { openMenu = null; renderTools(); return; }
    if (focusOn) { setFocus(false); return; }
    if (inSearch()) { leaveSearch(); return; }
    return;
  }
  if (view !== "quiz" || (timedActive() && paused)) return;
  if (e.key==="ArrowLeft") return go(pos()-1);
  if (e.key==="ArrowRight") return go(pos()+1);
  const q = curQ(); if (!q) return;
  if (e.key==="Enter") {
    if (timedActive()) return go(pos()+1);
    if (q.type==="reveal") { const s = store(); if (s.ans[q.id]===undefined) { s.ans[q.id]="shown"; save(); renderCard(); } return; }
    return submit();
  }
  const k = e.key.toUpperCase();
  if (q.type!=="reveal" && k.length===1 && LET.indexOf(k)>=0 && !e.metaKey && !e.ctrlKey) {
    const o = order(q), idx = LET.indexOf(k);
    if (idx < o.length) pick(o[idx]);
  }
});

// timer for timed blocks (runs only while the block is open, unpaused and the page is visible)
let tick = 0;
setInterval(()=>{
  if (view!=="quiz" || !timedActive() || paused || document.visibilityState!=="visible") return;
  const t = chap().test;
  t.remaining = Math.max(0, (t.remaining||0) - 1);
  const el = $("timer");
  if (el) { el.textContent = "⏱ " + fmtTime(t.remaining); el.classList.toggle("low", t.remaining<=60); }
  if (++tick % 5 === 0) save();
  if (t.remaining <= 0) finishTest(t, "time");
}, 1000);

themeLabel();
if (S.openSec === undefined) S.openSec = secOf(S.cur) || (courseSecs()[0] ? courseSecs()[0].prefix : null);
save();
renderAll();
})();
</script>
